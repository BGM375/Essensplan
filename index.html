  let times=`<span class="chip">Gesamt ca. ${d.t} Min.</span>`;
  if(d.mo!=null) times+=`<span class="chip a">${d.mo?`Morgens ${d.mo} Min.`:'Morgens nichts zu tun'}</span>`;
  if(d.va) times+=`<span class="chip hint">Am Vorabend ${d.va} Min.</span>`;
  $('#sheetInner').innerHTML=`<div class="grab"></div><div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start"><div style="min-width:0"><div class="eyebrow">${esc(d.m)} · Woche ${d.w}</div><h2>${esc(d.n)}</h2></div><button class="iconbtn" id="closeSheet" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="chips"><span class="chip">${meta[0]}</span><span class="chip p">${meta[1]}</span><span class="chip">${meta[2]}</span><span class="chip">${meta[3]}</span></div>
    <div class="chips">${times}</div>
    <h3 class="eyebrow" style="margin:18px 0 6px">Zutaten</h3>
    <table class="ing"><thead><tr><th>Zutat</th><th>pro Portion</th>${por>1?`<th>kochen (${por} Port.)</th>`:''}</tr></thead><tbody>
    ${d.ing.map(([n,g])=>{ const sp=spoon(n,g*por); return `<tr><td>${esc(n)}${sp&&por===1?` <span class="muted" style="font-size:.8rem">(${sp})</span>`:''}</td><td class="g">${fmtG(g)} g</td>${por>1?`<td class="g"><b>${fmtG(g*por)} g</b>${sp?`<br><span class="muted" style="font-size:.78rem;font-weight:400">${sp}</span>`:''}</td>`:''}</tr>`; }).join('')}</tbody></table>
    <h3 class="eyebrow" style="margin:18px 0 0">Zubereitung</h3>${stepsHtml(d.z)}
    <p class="muted" style="font-size:.85rem;margin-top:14px">Gewürze, Kräuter, Essig und Brühe nach Bedarf. Fleisch, Fisch und Gemüse roh gewogen, Nudeln, Reis und Linsen trocken.</p>`;
  $('#sheet').hidden=false; $('#closeSheet').onclick=closeSheet; $('#closeSheet').focus();
}

/* ---------- routing ---------- */
function keepScroll(fn){ const y=window.scrollY; fn(); window.scrollTo(0,y); }
/* ---------- Vorrat (stock) ---------- */
function stockHas(n){ return S.stock && Object.prototype.hasOwnProperty.call(S.stock,n); }
function stockGet(n){ return stockHas(n)? S.stock[n] : null; }
const PC_DEFAULT=new Set(['Stück','Kopf','Knolle','Stange','Bund','Kugel']);
const ABBR={'Stück':'St.','Packung':'Pck.','Flasche':'Fl.'};
function pcWeight(n){ const u=D.nut[n]; return u&&u[1]>0?u[1]:0; }
function pcName(n){ const u=D.nut[n]; const un=(u&&u[2])||'Stück'; return ABBR[un]||un; }
function unitOf(n){ if(!pcWeight(n)) return 'g'; const s=S.stockUnit&&S.stockUnit[n]; if(s) return s; const u=D.nut[n][2]; return (PC_DEFAULT.has(u)&&n!=='Parmesan'&&n!=='Schweinefilet')?'pc':'g'; }
function r1(x){ return Math.round(x*10)/10; }
function fmtAmt(n,g){ if(unitOf(n)==='pc'){ const v=r1(g/pcWeight(n)); return v.toLocaleString('de-DE')+'\u00a0'+pcName(n); } return fmt(g)+'\u00a0g'; }
function weekNeed(w,n){ const x=D.need&&D.need[w]&&D.need[w][n]; return x? x.reduce((s,[,g])=>s+g,0):0; }
/* remaining need: full week minus meals already cooked in the matching cycle */
let OCC={1:[],2:[],3:[],4:[]};
function rebuildOCC(){ OCC={1:[],2:[],3:[],4:[]}; EP.forEach(m=>{ const d=D.dishes[m[4]]; if(!d||isLeftover(m)||isExternal(m)) return; OCC[m[0]].push({row:m,pw:m[0],di:DAYS.indexOf(m[1]),meal:m[2],id:m[4],por:(m[2]==='Abendessen'||m[2]==='Mittagessen')?rowPor(m):1}); }); }
recomputeAll();
function cycleBase(w){ const today=new Date(); today.setHours(0,0,0,0); const pos=cyclePos(today); const start=parseISO(S.start);
  let k=pos.before?0:Math.floor(pos.diff/28); if(!pos.before && w<pos.week) k+=1; return addDays(start,k*28); }
function remainingNeed(w,n){
  const base=cycleBase(w); let s=0;
  OCC[w].forEach(o=>{ const d=D.dishes[o.id]; const ing=d.ing.find(x=>x[0]===n); if(!ing) return;
    const date=addDays(base,(o.pw-1)*7+o.di); if(S.cooked&&S.cooked[cookKey(date,o.meal)]) return; const pr=(o.meal==='Abendessen'||/Start-Gericht/.test(o.row[5]||''))?effPor(o.row,date):(rowSkipped(o.row,date)?0:1); s+=ing[1]*pr; });
  return s;
}
function stockCovers(w,n){ const need=remainingNeed(w,n); return weekNeed(w,n)>0 && stockHas(n) && S.stock[n]+0.5>=need; }
function unitHint(n){ const u=D.nut[n]; if(!u||!u[1]) return ''; const st=u[1], un=u[2]||'Stück'; return `1 ${un} ≈ ${fmt(st)} g`; }
function packGrams(n,g){ const u=D.nut[n]; if(u&&u[1]&&u[1]>0) return Math.ceil(g/u[1]-1e-9)*u[1]; return g; }
function cookKey(date,meal){ return iso(date)+'|'+meal; }
function isLeftover(m){ return m[2]==='Mittagessen' && /aufwärmen/.test(m[5]||''); }
function isExternal(m){ return /_D_GRILL$/.test(m[4]); }
function dishNeed(id,por){ const d=D.dishes[id]; por=por||d.por||1; return d.ing.map(([n,g])=>[n,g*por]); }
function missingFor(id,por){ return dishNeed(id,por).filter(([n,g])=>stockHas(n) && S.stock[n] < g - 0.5).map(([n,g])=>[n, g-S.stock[n]]); }
function toggleCooked(date,m){
  S.cooked=S.cooked||{}; S.stock=S.stock||{};
  const k=cookKey(date,m[2]);
  if(S.cooked[k]){ const used=S.cooked[k].used||{}; Object.keys(used).forEach(n=>{ S.stock[n]=(S.stock[n]||0)+used[n]; }); delete S.cooked[k]; }
  else { const used={}; dishNeed(m[4], (m[2]==='Abendessen'||m[2]==='Mittagessen')?(effPor(m,date)||rowPor(m)):1).forEach(([n,g])=>{ if(!stockHas(n)) return; const before=S.stock[n]; const after=Math.max(0,before-g); used[n]=(used[n]||0)+(before-after); S.stock[n]=after; }); S.cooked[k]={id:m[4],used}; }
  persist();
}
function addPurchase(w,it){
  if(S.autoStock===false || it.spice || it.extra || !it.g) return;
  S.stock=S.stock||{}; S.bought=S.bought||{}; S.bought[w]=S.bought[w]||{};
  const add=packGrams(it.name,it.g); const created=!stockHas(it.name); S.stock[it.name]=(S.stock[it.name]||0)+add; S.bought[w][it.key]={add,created};
}
function removePurchase(w,it){
  const b=S.bought&&S.bought[w]&&S.bought[w][it.key]; if(!b) return;
  const add=typeof b==='number'?b:b.add; const v=Math.max(0,(S.stock[it.name]||0)-add);
  if(b.created && v<0.5) delete S.stock[it.name]; else S.stock[it.name]=v; delete S.bought[w][it.key];
}

const T = JSON.parse(document.getElementById('trainingdata').textContent);
const FIT_TIME='19:00', STRETCH_TIME_TRAIN='19:55', STRETCH_TIME_REST='19:00';
function fitPlan(date){
  const pos=cyclePos(date); const wkey=T.days[String(pos.dow)]||null;
  return {pos, phase:pos.week, wkey, skey: wkey?'post_'+wkey:'rest'};
}
function fitRec(dk){ S.fit=S.fit||{}; S.fit[dk]=S.fit[dk]||{ex:{}}; S.fit[dk].ex=S.fit[dk].ex||{}; return S.fit[dk]; }
function fitGet(dk){ return (S.fit&&S.fit[dk])||{ex:{}}; }
function lastKg(dk,id){
  if(!S.fit) return null;
  const keys=Object.keys(S.fit).filter(k=>k<dk).sort().reverse();
  for(const k of keys){ const e=S.fit[k].ex&&S.fit[k].ex[id]; if(e&&e.kg) return {kg:e.kg,date:k}; }
  return null;
}
function addMin(hhmm,min){ const [h,m]=hhmm.split(':').map(Number); const t=h*60+m+min; return String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }
function sessionsOn(date){
  const dk=iso(date); const res=[]; const mv=S.moves||{};
  const fp=fitPlan(date);
  if(fp.wkey && !mv[dk]) res.push({origin:dk, wkey:fp.wkey, time:FIT_TIME});
  Object.keys(mv).forEach(o=>{ const m=mv[o]; if(m && m.to===dk){ const w=fitPlan(parseISO(o)).wkey; if(w) res.push({origin:o, wkey:w, time:m.time||FIT_TIME, from:o}); } });
  return res.sort((a,b)=>a.time.localeCompare(b.time));
}
function skippedOn(date){ const dk=iso(date); const m=S.moves&&S.moves[dk]; if(m && m.to===null){ const w=fitPlan(date).wkey; if(w) return {origin:dk,wkey:w}; } return null; }
function movedAway(date){ const dk=iso(date); const m=S.moves&&S.moves[dk]; return (m&&m.to)?{origin:dk,to:m.to,wkey:fitPlan(date).wkey}:null; }
function stretchKeyFor(date){ const ss=sessionsOn(date); if(!ss.length) return 'rest'; const main=ss.find(s=>s.wkey!=='core')||ss[0]; return 'post_'+main.wkey; }
function shortDay(dk){ return parseISO(dk).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'numeric'}); }

function fitItems(date){
  const dk=iso(date); const out=[];
  const ss=sessionsOn(date);
  ss.forEach(s=>{
    const wo=T.workouts[s.wkey]; const ph=T.phases[String(fitPlan(parseISO(s.origin)).phase)]; const r=fitGet(s.origin);
    const nEx=wo.ex.length, nDone=wo.ex.filter(x=>r.ex[x.id]&&r.ex[x.id].done).length;
    out.push({time:s.time, html:`<div class="meal fit${r.done?' cooked':''}"><div class="time">${s.time}</div><div class="card"><button class="cardbtn" data-workout="${s.origin}">
      <div class="kind fitk">Training · ${esc(ph.n)}</div><div class="name">${esc(wo.n)}</div>
      <div class="chips"><span class="chip">ca. ${wo.dur} Min.</span><span class="chip">${wo.circuit?wo.rounds[fitPlan(parseISO(s.origin)).phase-1]+' Runden Zirkel':nEx+' Übungen'}</span><span class="chip a">${esc(ph.rir)}</span>${s.from?`<span class="chip hint">verschoben von ${esc(shortDay(s.from))}</span>`:''}${nDone&&!r.done?`<span class="chip">${nDone}/${nEx} erledigt</span>`:''}</div></button>
      <div class="cookrow row" style="gap:8px"><button class="cookbtn" data-fitdone="${s.origin}" aria-pressed="${!!r.done}">${r.done?'✓ Training erledigt · rückgängig':'Training erledigt'}</button>${r.done?'':`<button class="cookbtn ghostbtn" data-move="${s.origin}">Verschieben</button>`}</div></div></div>`});
  });

  if(skip) out.push({time:FIT_TIME, html:`<div class="meal fit gone"><div class="time">${FIT_TIME}</div><div class="card"><div class="kind fitk">Training ausgefallen</div><div class="name muted">${esc(T.workouts[skip.wkey].n)}</div><div class="cookrow"><button class="cookbtn ghostbtn" data-unmove="${skip.origin}">Doch trainieren</button></div></div></div>`});
  const skey=stretchKeyFor(date); const st=T.stretch[skey]; const rr=fitGet(dk);
  let stTime=STRETCH_TIME_REST;
  if(ss.length){ const last=ss[ss.length-1]; stTime=addMin(last.time, T.workouts[last.wkey].dur); }
  out.push({time:stTime, html:`<div class="meal fit${rr.stretch?' cooked':''}"><div class="time">${stTime}</div><div class="card"><button class="cardbtn" data-stretch="${dk}">
    <div class="kind fitk">Dehnen${ss.length?' · direkt nach dem Training':' · Ruhetag'}</div><div class="name">${esc(st.n)}</div>

  return out;
}

function setMove(origin, to, time){
  S.moves=S.moves||{};

  else S.moves[origin]={to, time:time||FIT_TIME};

}
function openMove(origin){
  const od=parseISO(origin); const fp=fitPlan(od); const wo=T.workouts[fp.wkey];
  const monday=addDays(od,-fp.pos.dow); const cur=S.moves&&S.moves[origin];
  const today=new Date(); today.setHours(0,0,0,0);
  const curTime=(cur&&cur.time)||FIT_TIME;
  let h=sheetHead('Training verschieben', wo.n);
  h+=`<p class="muted" style="margin-top:6px">Nur diese Einheit wandert, alle anderen Trainingstage bleiben. Das Dehnen geht automatisch mit.</p>
    <div class="field" style="margin:10px 0"><label for="moveTime">Uhrzeit</label><input type="time" id="moveTime" value="${curTime}" style="max-width:160px"></div>
    <div class="stack">`;
  const opts=[];
  for(let i=0;i<7;i++){
    const d=addDays(monday,i); const dk=iso(d);
    const others=sessionsOn(d).filter(s=>s.origin!==origin);
    const notes=[]; let cls='';
    if(dk===origin) notes.push('ursprünglicher Tag');
    if(others.length){ notes.push('schon Training: '+others.map(s=>T.workouts[s.wkey].n).join(', ')); cls='warn'; }
    else if(dk!==origin) notes.push('Ruhetag');
    const prev=sessionsOn(addDays(d,-1)).filter(s=>s.origin!==origin), next=sessionsOn(addDays(d,1)).filter(s=>s.origin!==origin);
    if(fp.wkey!=='core' && prev.some(s=>s.wkey===fp.wkey)) notes.push('Vortag gleiche Muskelgruppe');
    if(fp.wkey==='legs' && next.some(s=>s.wkey==='legs')) notes.push('Folgetag gleiche Muskelgruppe');
    if(i===4) notes.push('mittags Grillen');
    if(d<today) { notes.push('liegt in der Vergangenheit'); cls=cls||'past'; }
    const isCur = cur ? (cur.to===dk) : (dk===origin);
    opts.push({rank:(others.length?2:0)+(d<today?3:0), html:`<button class="day dayfit pick ${cls}${isCur?' sel':''}" data-moveto="${dk}"><div><div class="d">${DAYS[i]} <span class="muted" style="font-size:.85rem;font-family:var(--f-body)">${d.toLocaleDateString('de-DE',{day:'numeric',month:'numeric'})}</span></div><div class="muted" style="font-size:.88rem">${esc(notes.join(' · '))}</div></div>${isCur?'<span class="chip a">aktuell</span>':''}</button>`});
  }
  h+=opts.sort((a,b)=>a.rank-b.rank).map(o=>o.html).join('')+'</div>';
  h+=`<div class="row" style="margin-top:14px"><button class="btn warn" data-skipwo="${origin}">Diese Woche ausfallen lassen</button>${cur?`<button class="btn ghost" data-unmove="${origin}">Zurück auf ${esc(shortDay(origin))}</button>`:''}</div>
    <p class="muted" style="font-size:.85rem;margin-top:10px">Fällt ein Training aus, bleibt dein Fortschritt gleich. Beim nächsten Mal steht das gleiche Gewicht drin.</p>`;
  sheetOpen(h);
  const inner=$('#sheetInner');
  inner.querySelectorAll('[data-moveto]').forEach(b=>b.onclick=()=>{ setMove(origin, b.dataset.moveto, $('#moveTime').value||FIT_TIME); closeSheet(); render(); });
  inner.querySelector('[data-skipwo]').onclick=()=>{ S.moves=S.moves||{}; S.moves[origin]={to:null}; persist(); closeSheet(); render(); };
  const um=inner.querySelector('[data-unmove]'); if(um) um.onclick=()=>{ delete S.moves[origin]; persist(); closeSheet(); render(); };
}

const GEAR_DEFAULT={lh:10, sz:7, kh:2, k1:3, shared:true,
  inv:[{w:20,n:2},{w:10,n:2},{w:5,n:4},{w:2.5,n:4},{w:1.25,n:4},{w:0.5,n:4}],
  invKh:[{w:5,n:4},{w:2.5,n:4},{w:1.25,n:4},{w:0.5,n:4}]};
function gear(){
  const g=Object.assign({}, GEAR_DEFAULT, S.gear||{});
  // migrate old text lists (weights only) to counted inventory
  if(S.gear && !S.gear.inv && S.gear.platesBar){ g.inv=parsePlates(S.gear.platesBar).map(w=>({w,n:4})); }
  if(S.gear && !S.gear.invKh && S.gear.platesKh){ g.invKh=parsePlates(S.gear.platesKh).map(w=>({w,n:4})); }
  return g;
}
function parsePlates(s){ return String(s||'').split(/;|\s+|,(?=\s)|\/|\|/).map(v=>parseFloat(v.replace(',','.'))).filter(v=>v>0).sort((a,b)=>b-a); }
function implOf(x){ if(x.start==null) return null; if(/^Langhantel/.test(x.eq)) return 'lh'; if(/^SZ-Stange/.test(x.eq)) return 'sz'; if(/Kurzhantel/.test(x.eq)) return x.one?'k1':'kh'; return null; }
const IMPL_NAME={lh:'Langhantel', sz:'SZ-Stange', kh:'Kurzhantel-Paar', k1:'Einzelne Kurzhantel'};
const MULT={lh:2, sz:2, kh:4, k1:2};           // plates needed per "per-side" plate: bar 2 sides, dumbbell pair 2×2 sides
function poolOf(im,g){ return ((im==='kh'||im==='k1') && !g.shared) ? 'kh' : 'bar'; }
function poolInv(pool,g){ return (pool==='kh'?g.invKh:g.inv).filter(p=>p.w>0&&p.n>0).map(p=>({u:Math.round(p.w*100), n:Math.floor(p.n)})).sort((a,b)=>b.u-a.u); }
function typesFor(im,g){ return poolInv(poolOf(im,g),g).map(p=>({u:p.u, c:Math.floor(p.n/MULT[im])})).filter(p=>p.c>0); }
function reachable(maxU, types){
  const r=new Uint8Array(maxU+1); r[0]=1;
  types.forEach(t=>{ for(let k=0;k<t.c;k++){ for(let s=maxU; s>=t.u; s--) if(r[s-t.u]) r[s]=1; } });
  return r;
}
function combos(sideU, types, cap){
  const out=[]; const cur=[];
  (function rec(i, rest){
    if(out.length>=cap) return;
    if(rest===0){ out.push(cur.slice()); return; }
    if(i>=types.length) return;
    const t=types[i]; const maxk=Math.min(t.c, Math.floor(rest/t.u));
    for(let k=maxk;k>=0;k--){ for(let j=0;j<k;j++) cur.push(t.u); rec(i+1, rest-k*t.u); for(let j=0;j<k;j++) cur.pop(); if(out.length>=cap) return; }
  })(0, sideU);

}
function sideTarget(x,total){ const im=implOf(x); const g=gear(); const base=+g[im]||0; return Math.round(((total-base)/2)*100); }
function achievable(x,total,dir){
  // snap a total weight to what your plates can build for this implement

  const g=gear(); const base=+g[im]||0; const types=typesFor(im,g);
  const want=Math.max(0, sideTarget(x,total)); const maxU=Math.max(want+2000, 100);
  const r=reachable(maxU, types);
  if(r[want]) return base+2*want/100;
  if(dir==='up'){ for(let s=want+1;s<=maxU;s++) if(r[s]) return base+2*s/100; }
  for(let s=want-1;s>=0;s--) if(r[s]) return base+2*s/100;

}
function kgStr(v){ return (Math.round(v*100)/100).toLocaleString('de-DE'); }
function loadStr(arr){ return arr.length? arr.map(u=>kgStr(u/100)).join(' + ') : 'leer'; }
function diffLoads(a,b){ // per-side plate moves between two loads
  const ca={}, cb={}; a.forEach(u=>ca[u]=(ca[u]||0)+1); b.forEach(u=>cb[u]=(cb[u]||0)+1);
  const add=[], rem=[];
  new Set([...Object.keys(ca),...Object.keys(cb)]).forEach(k=>{ const d=(cb[k]||0)-(ca[k]||0); for(let i=0;i<Math.abs(d);i++) (d>0?add:rem).push(+k); });
  return {add:add.sort((x,y)=>y-x), rem:rem.sort((x,y)=>y-x), n:add.length+rem.length};
}
/* Plan the plates for a whole session: fewest plate moves, never more plates in use than you own. */
function planSession(steps){
  const g=gear(); const IM=['lh','sz','kh','k1'];
  const invByPool={bar:{}, kh:{}}; ['bar','kh'].forEach(pl=>poolInv(pl,g).forEach(p=>invByPool[pl][p.u]=p.n));
  const feasible=st=>{ const use={bar:{},kh:{}}; for(const im of IM){ const pl=poolOf(im,g); st[im].forEach(u=>use[pl][u]=(use[pl][u]||0)+MULT[im]); }
    for(const pl of ['bar','kh']) for(const u in use[pl]) if(use[pl][u]>(invByPool[pl][u]||0)) return false; return true; };
  const keyOf=st=>IM.map(im=>st[im].join(',')).join('|');
  let states=new Map(); const start={lh:[],sz:[],kh:[],k1:[]}; states.set(keyOf(start),{st:start,cost:0,hist:[]});
  steps.forEach((s,idx)=>{
    const next=new Map();
    const types=typesFor(s.im,g);
    let want=Math.max(0,s.sideU); const r=reachable(want, types); while(want>0 && !r[want]) want--;
    const cands=combos(want, types, 40); if(!cands.length) cands.push([]);
    states.forEach(v=>{
      cands.forEach(c=>{
        const others=IM.filter(im=>im!==s.im);
        // options: keep the other implements loaded, or strip one or both of them to free plates
        const strips=[[]]; for(let m=1;m<(1<<others.length);m++) strips.push(others.filter((_,i)=>m&(1<<i)));
        strips.forEach(sl=>{
          const st={lh:v.st.lh,sz:v.st.sz,kh:v.st.kh,k1:v.st.k1}; let cost=v.cost; const ops=[];
          sl.forEach(o=>{ if(st[o].length){ cost+=st[o].length*MULT[o]+0.5; ops.push({im:o, from:st[o], to:[]}); st[o]=[]; } });
          if(sl.length && !ops.length) return;
          const d=diffLoads(v.st[s.im], c); cost+=d.n*MULT[s.im] + c.length*0.01;
          ops.push({im:s.im, from:v.st[s.im], to:c});
          st[s.im]=c;
          if(!feasible(st)) return;
          const k=keyOf(st); const prev=next.get(k);
          if(!prev || cost<prev.cost) next.set(k,{st, cost, hist:v.hist.concat([{idx, ops, sideU:want, wanted:s.sideU}])});
        });
      });
    });
    states=next.size?next:states;
    if(states.size>400){ states=new Map([...states.entries()].sort((a,b)=>a[1].cost-b[1].cost).slice(0,400)); }
  });
  let best=null; states.forEach(v=>{ if(!best||v.cost<best.cost) best=v; });

}
function setupFits(list,g){
  const inv={bar:{},kh:{}}; ['bar','kh'].forEach(pl=>poolInv(pl,g).forEach(p=>inv[pl][p.u]=p.n));
  const use={bar:{},kh:{}}; list.forEach(s=>{ const pl=poolOf(s.im,g); s.load.forEach(u=>use[pl][u]=(use[pl][u]||0)+MULT[s.im]); });
  for(const pl of ['bar','kh']) for(const u in use[pl]) if(use[pl][u]>(inv[pl][u]||0)) return false; return true;
}
const _spCache={};
function sessionPlates(dk, wo, kgOf){
  const ck=dk+'|'+JSON.stringify(gear())+'|'+wo.ex.map(x=>kgOf(x)).join(',');
  if(_spCache[ck]) return _spCache[ck];
  return (_spCache[ck]=sessionPlatesRaw(dk, wo, kgOf));
}
function sessionPlatesRaw(dk, wo, kgOf){
  const g=gear(); const steps=[];
  wo.ex.forEach((x,i)=>{ const im=implOf(x); const kg=kgOf(x); if(!im||kg==null||isNaN(kg)) return; steps.push({i, im, x, sideU:sideTarget(x,kg), kg}); });
  const hist=planSession(steps);
  const byEx={}; const setup=[]; const seen={lh:false,sz:false,kh:false,k1:false}; let stripped=false;
  hist.forEach(hh=>{ const s=steps[hh.idx];
    const main=hh.ops[hh.ops.length-1]; const strip=hh.ops.slice(0,-1);
    if(strip.length) stripped=true;
    const first=!seen[s.im]; seen[s.im]=true;
    const realKg=(+g[s.im]||0)+2*hh.sideU/100;
    const info={im:s.im, load:main.to, from:main.from, strip, realKg, short: hh.sideU<s.sideU, wantKg:s.kg};
    if(first && !stripped && !main.from.length && setupFits(setup.concat([{im:s.im, load:main.to}]), g)){ setup.push({im:s.im, load:main.to}); info.preloaded=true; }

}
function plateHtml(x, info){
  if(!info) return '';
  const g=gear(); const base=+g[info.im]||0; const each=info.im==='kh'?' je Hantel':'';
  let h=`<div class="plates"><b>${IMPL_NAME[info.im]}${each}:</b> ${info.load.length?'pro Seite '+loadStr(info.load):'ohne Scheiben'} → ${kgStr(info.realKg)} kg`;
  if(info.short) h+=` <span class="warnTxt">(Scheiben reichen nicht für ${kgStr(info.wantKg)} kg)</span>`;
  const parts=[];
  info.strip.forEach(sp=>parts.push(`${IMPL_NAME[sp.im]} abräumen`));
  if(!info.preloaded){
    const d=diffLoads(info.from, info.load);
    if(d.n===0) parts.push('kein Umbau');
    else parts.push('Umbau pro Seite'+each+': '+[d.rem.length?'− '+loadStr(d.rem):'', d.add.length?'+ '+loadStr(d.add):''].filter(Boolean).join(', '));
  } else parts.push('schon beim Aufbau geladen');
  h+=`<div class="muted" style="font-size:.82rem">${esc(parts.join(' · '))}</div></div>`;
  return h;
}

function roundStep(v,step){ step=step||1; return Math.max(step, Math.round(v/step)*step); }
function suggestKg(dk,x){
  if(x.start==null) return null;
  const phase=fitPlan(parseISO(dk)).phase;
  const p=S.prog&&S.prog[x.id];
  const base = p ? p.kg : x.start;
  return achievable(x, phase===4 ? roundStep(base*0.8, x.step||1) : base, 'down');
}
function verdictFor(x, kg, reps, phase){
  // double progression: all sets at the top of the range -> heavier next time
  if(!x.rmin) return null;
  const n=reps.length; if(!n) return null;
  const top=reps.every(r=>r>=x.rmax), low=reps.filter(r=>r<x.rmin).length;
  if(phase===4) return {kind:'deload', text:'Entlastungswoche: Ergebnis zählt nicht für die Steigerung.'};
  if(kg==null){ return top?{kind:'up',text:x.id==='liegest'?'':'Alle Sätze geschafft: nächstes Mal ein stärkeres Band oder langsamer ausführen.'}:{kind:'hold',text:'Weiter so, Ziel: in allen Sätzen '+x.rmax+' Wiederholungen.'}; }
  if(top){ const next=achievable(x, kg+(x.step||1), 'up'); return {kind:'up', next, text:`Alle Sätze mit ${x.rmax}+ Wdh. geschafft. Nächstes Mal ${kgStr(next)} kg.`}; }
  if(low>=2){ const next=achievable(x, roundStep(kg*0.9, x.step||1), 'down'); return {kind:'down', next, text:`${low} Sätze unter ${x.rmin} Wdh. Nächstes Mal etwas leichter: ${kgStr(next)} kg.`}; }
  return {kind:'hold', next:kg, text:`Gewicht halten (${kgStr(kg)} kg). Ziel: in allen Sätzen ${x.rmax} Wiederholungen.`};
}
function updateProg(dk,x){
  const r=fitGet(dk); const e=r.ex[x.id]; if(!e) return;
  const phase=fitPlan(parseISO(dk)).phase; const sets=x.sets[phase-1];
  const reps=(e.reps||[]).slice(0,sets);
  if(reps.length<sets || reps.some(v=>v==null||v==='')) { e.verdict=null; return; }
  const v=verdictFor(x, x.start!=null?(e.kg!=null?e.kg:suggestKg(dk,x)):null, reps.map(Number), phase);
  e.verdict=v;
  if(v && v.next!=null && phase!==4){ S.prog=S.prog||{}; const cur=S.prog[x.id]; if(!cur || cur.date<=dk) S.prog[x.id]={kg:v.next, date:dk}; }
}
function openWorkout(dk){
  const date=parseISO(dk); const fp=fitPlan(date); if(!fp.wkey) return;

  h+=`<details class="howto" style="margin-top:12px"><summary><b>${esc(T.warmup.n)}</b></summary><ul>${T.warmup.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></details>`;

  if(sp.setup.length) h+=`<div class="panel setup" style="margin-top:12px"><b>Zu Beginn aufbauen</b><ul>${sp.setup.map(s=>`<li>${IMPL_NAME[s.im]}${s.im==='kh'?' (die beiden gleichen)':s.im==='k1'?' (die schwerere einzelne)':''}: ${s.load.length?'pro Seite '+loadStr(s.load):'ohne Scheiben'}</li>`).join('')}</ul><div class="muted" style="font-size:.85rem">So musst du während des Trainings möglichst wenig umstecken. Bei jeder Übung steht, was sich ändert.</div></div>`;

  h+='<div class="stack" style="margin-top:12px">'+wo.ex.map((x,i)=>{
    const e=r.ex[x.id]||{}; const last=lastKg(dk,x.id); const sug=suggestKg(dk,x);
    const kgVal = e.kg!=null ? e.kg : sug;
    const dose= wo.circuit ? esc(x.reps) : `${x.sets[pi]} × ${esc(x.reps)} · Pause ${x.rest} Sek.`;

      <div style="min-width:0;flex:1"><div class="iname">${i+1}. ${esc(x.n)}</div><div class="mus">${esc(x.mus||'')}</div><div class="iamt">${dose}</div><div class="iamt">${esc(x.eq)}</div></div>
      ${x.kg?`<div class="sin col"><div class="row" style="gap:4px;flex-wrap:nowrap"><input type="number" inputmode="decimal" step="0.5" min="0" data-exkg="${x.id}" value="${kgVal!=null?kgVal:''}" placeholder="kg" aria-label="Gewicht ${esc(x.n)} in kg"><span>kg</span></div>${kgNote?`<span class="kgnote">${kgNote}</span>`:''}</div>`:''}</div>
      ${x.kg&&last?`<div class="iamt" style="margin:2px 0 0 50px">Letztes Mal: ${kgStr(last.kg)} kg (${parseISO(last.date).toLocaleDateString('de-DE',{day:'numeric',month:'short'})})</div>`:(x.start!=null&&!S.prog?.[x.id]?`<div class="iamt" style="margin:2px 0 0 50px">Startvorschlag – beim ersten Mal anpassen, falls zu leicht oder zu schwer.</div>`:'')}

  inner.querySelectorAll('[data-rep]').forEach(inp=>inp.onchange=()=>{ const rr=fitRec(dk); const x=wo.ex.find(z=>z.id===inp.dataset.rep); ensureKg(rr,x); const e=rr.ex[x.id]; e.reps=e.reps||[]; const v=parseInt(inp.value,10); e.reps[+inp.dataset.k]= isNaN(v)?null:v;
    const n=x.sets[pi]; if(e.reps.slice(0,n).filter(v=>v!=null).length===n){ e.done=true; }
    updateProg(dk,x); if(wo.ex.every(z=>rr.ex[z.id]&&rr.ex[z.id].done)) rr.done=true; persist(); openWorkout(dk); render();
    const nx=$('#sheetInner').querySelector(`[data-rep="${x.id}"][data-k="${+inp.dataset.k+1}"]`); if(nx) nx.focus(); });
  bindFitButtons(inner, ()=>{ openWorkout(dk); render(); });
  inner.querySelector('[data-openstretch]').onclick=()=>{ const real=(S.moves&&S.moves[dk]&&S.moves[dk].to)||dk; openStretch(real); };
  const wm=inner.querySelector('#woMove'); if(wm) wm.onclick=()=>openMove(dk);
}
function openStretch(dk, key){
  const date=parseISO(dk); const fp=fitPlan(date); const skey=key||stretchKeyFor(date); const st=T.stretch[skey]; const r=fitGet(dk);
