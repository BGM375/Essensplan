<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>[hidden]{display:none!important} :root{padding-top:env(safe-area-inset-top,0px)} body{margin:0} img{max-width:100%}</style>
<title>Benjamins Essensplan</title>
<meta name="theme-color" content="#24533f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one-screen phone app — sticky header, scrolling content, fixed bottom tab bar. */
:root{
  --bg:#f2f5f1; --surface:#ffffff; --surface-2:#e7ede6; --fg:#17231d; --muted:#5b6b62; --line:#d5ded6;
  --accent:#24533f; --accent-fg:#ffffff; --accent-soft:#d9e8df; --tomato:#c9482e; --tomato-soft:#f6ded7;
  --amber:#a86a08; --amber-soft:#f5e7cc; --ok:#2e7d4f;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:14px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#18211c; --surface-2:#212d26; --fg:#e6eee8; --muted:#9aaba1; --line:#2c3a32;
  --accent:#7cc39f; --accent-fg:#0d1a13; --accent-soft:#1f3a2d; --tomato:#ef8a72; --tomato-soft:#3b221c;
  --amber:#e0a94a; --amber-soft:#3a2c14; --ok:#7cc39f; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18211c; --surface-2:#212d26; --fg:#e6eee8; --muted:#9aaba1; --line:#2c3a32;
  --accent:#7cc39f; --accent-fg:#0d1a13; --accent-soft:#1f3a2d; --tomato:#ef8a72; --tomato-soft:#3b221c;
  --amber:#e0a94a; --amber-soft:#3a2c14; --ok:#7cc39f; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.55rem;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:0}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)}

/* day header */
.daybar{display:flex;align-items:center;gap:8px;margin-block:4px 12px}
.daybar .title{flex:1;min-width:0}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.meter b{font-family:var(--f-display);font-size:1.35rem;font-weight:800}
.bar{height:6px;background:var(--surface-2);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.p i{background:var(--tomato)}

/* timeline of meals */
.timeline{display:flex;flex-direction:column}
.meal{display:grid;grid-template-columns:52px 1fr;gap:10px;text-align:left;background:none;border:0;padding:0;width:100%}
.meal .time{font-weight:700;font-variant-numeric:tabular-nums;padding-top:14px;color:var(--muted);position:relative}
.meal .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;min-width:0}
.meal.now .card{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.meal.now .time{color:var(--accent)}
.meal .kind{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.meal .name{font-weight:700;font-size:1.02rem;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:.8rem;padding:3px 9px;border-radius:999px;background:var(--surface-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.p{background:var(--tomato-soft);color:var(--tomato);font-weight:700}
.chip.hint{background:var(--amber-soft);color:var(--amber);white-space:normal}
.chip.a{background:var(--accent-soft);color:var(--accent);font-weight:700}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel.prep{border-left:4px solid var(--amber)}
.panel ul{margin:8px 0 0;padding-left:18px}
.panel li{margin-bottom:6px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-align:left}

/* segmented control */
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 8px;font-weight:700;color:var(--muted);white-space:nowrap;min-width:0}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.theme{margin:10px 0 4px;color:var(--muted)}

/* week view */
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.day > summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;cursor:pointer}
.day > summary::-webkit-details-marker{display:none}
.day > summary .d{font-family:var(--f-display);font-weight:600;font-size:1.08rem}
.day .items{border-top:1px solid var(--line)}
.wmeal{display:grid;grid-template-columns:48px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px}
.wmeal:last-child{border-bottom:0}
.wmeal .t{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.wmeal .n{min-width:0}
.wmeal .k{font-size:.85rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* shopping */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-block:10px}
.toggle{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.9rem;font-weight:700}
.toggle[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.progress{flex:1;min-width:120px}
.group{margin-top:14px}
.group h3{font-family:var(--f-display);font-weight:600;font-size:1rem;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:44px 1fr 44px;gap:6px;align-items:center;padding:8px 8px 8px 4px;border-bottom:1px solid var(--line)}
.item .meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:4px}
.item .side{display:flex;flex-direction:column;gap:4px;align-items:center}
.item:last-child{border-bottom:0}
.item.done .iname{text-decoration:line-through;color:var(--muted)}
.item.home{background:var(--surface-2)}
.item.home .iname{color:var(--muted)}
.homelbl{color:var(--accent);font-weight:700}
.homebtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;flex:none}
.homebtn svg{width:20px;height:20px}
.homebtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.days{display:flex;flex-wrap:wrap;gap:4px;flex-basis:100%}
.dchip{font-size:.72rem;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.dchip small{font-weight:400;font-size:.68rem}
.dchip.pre{background:var(--amber-soft);color:var(--amber)}
.meal{display:grid;grid-template-columns:52px 1fr;gap:10px}
.cardbtn{display:block;width:100%;text-align:left;background:none;border:0;padding:0;color:inherit}
.cookrow{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.cookbtn{border:1px solid var(--accent);background:none;color:var(--accent);border-radius:999px;padding:7px 12px;font-weight:700;font-size:.88rem}
.cookbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.meal.cooked .card{background:var(--surface-2)}
.chip.miss,.dchip.miss{background:var(--tomato-soft);color:var(--tomato);font-weight:700;white-space:normal}
.sitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.sitem:last-child{border-bottom:0}
.sin{display:flex;align-items:center;gap:4px}
.useg{display:flex;flex-direction:column;gap:2px}
.useg button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:7px;padding:3px 6px;font-size:.75rem;font-weight:700;min-width:44px}
.useg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.sin input{width:76px;text-align:right;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 8px;font-variant-numeric:tabular-nums}
.fitk{color:var(--tomato)}
.meal.fit .card{border-left:4px solid var(--tomato)}
.dayfit{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;color:inherit;font:inherit;cursor:pointer}
.dayfit .d{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.dayfit.rest{background:var(--surface-2)}
.exo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.exo.done{background:var(--surface-2)}
.exo.done .iname{text-decoration:line-through;color:var(--muted)}
.exhead{display:flex;gap:6px;align-items:center}
.exo .check{margin-left:-8px}
.exo.done .check span{background:var(--accent);border-color:var(--accent)}
.exo.done .check svg{opacity:1}
.howto{margin-top:6px}
.howto summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:.9rem;padding:4px 0}
.howto ul{margin:6px 0 0;padding-left:20px}
.setrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 0}
.setin{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);font-weight:700}
.setin input{width:58px;text-align:center;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 4px;font-variant-numeric:tabular-nums}
.sin.col{flex-direction:column;align-items:flex-end;gap:2px}
.kgnote{font-size:.68rem;color:var(--muted);white-space:nowrap}
.verdict{margin-top:8px;padding:8px 10px;border-radius:10px;font-size:.9rem;font-weight:700;background:var(--surface-2)}
.verdict.up{background:var(--accent-soft);color:var(--accent)}
.verdict.down{background:var(--amber-soft);color:var(--amber)}
.ghostbtn{border-color:var(--line);color:var(--fg)}
.meal.gone .card{background:var(--surface-2);border-style:dashed}
.dayfit.pick.warn{border-color:var(--amber)}
.dayfit.pick.past{opacity:.6}
.dayfit.pick.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dayfit{flex-wrap:wrap}
.plates{margin:6px 0 0 50px;font-size:.85rem;color:var(--fg);background:var(--surface-2);border-radius:8px;padding:6px 8px}
.plates.warn{color:var(--tomato);background:var(--tomato-soft)}
.gearrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.invt{display:grid;gap:6px}
.invrow{display:flex;align-items:center;gap:6px}
.invrow input{width:76px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px;text-align:right;font-variant-numeric:tabular-nums}
.invrow .x{color:var(--muted)}
.panel.setup{border-left:4px solid var(--accent)}
.panel.setup ul{margin:6px 0;padding-left:18px}
.warnTxt{color:var(--tomato);font-weight:700}
.mus{font-size:.8rem;font-weight:700;color:var(--tomato);margin:1px 0 2px}
.item.partial{background:#fff3c4}
.item.partial .partlbl{color:#7a5a00;font-weight:700}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .item.partial{background:#3d3410} :root:not([data-theme="light"]) .item.partial .partlbl{color:#f2d27a} }
:root[data-theme="dark"] .item.partial{background:#3d3410}
:root[data-theme="dark"] .item.partial .partlbl{color:#f2d27a}
.wrow{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow .wmeal{border-bottom:0;flex:1;min-width:0}
.swapbtn{width:38px;flex:none;border:0;border-left:1px solid var(--line);background:none;color:var(--accent);font-size:1.15rem;font-weight:700}
.swapbtn.off{border-left:1px solid var(--line)}
.swaptag{font-size:.68rem;letter-spacing:.04em;background:var(--amber-soft);color:var(--amber);padding:1px 6px;border-radius:6px;text-transform:none}
.dchip.other{background:var(--surface-2);color:var(--fg)}
.dchip.none{background:var(--tomato-soft);color:var(--tomato)}
.wrow.skipped .wmeal b{text-decoration:line-through;color:var(--muted)}
.wrow.skipped{background:var(--surface-2)}
.skipbtn{color:var(--tomato)}
.subhead{font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:10px 2px 5px}
.group h3 + .subhead{margin-top:2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;margin-top:8px;align-items:center}
.legend > span{display:inline-flex;gap:6px;align-items:center}
.mini{width:14px;height:14px;border-radius:4px;background:var(--accent);display:inline-block}
.check{width:44px;height:44px;display:grid;place-items:center;background:none;border:0}
.check span{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center}
.item.done .check span{background:var(--accent);border-color:var(--accent)}
.check svg{width:16px;height:16px;stroke:var(--accent-fg);opacity:0}
.item.done .check svg{opacity:1}
.iname{font-weight:700;min-width:0;overflow-wrap:break-word;hyphens:auto}
.iamt{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.store{max-width:100%;padding:5px 6px !important;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 6px;font-size:.88rem}
.store.none{color:var(--muted);font-style:italic}
.addform{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:10px}
.addform input,.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
.btn{border:0;background:var(--accent);color:var(--accent-fg);border-radius:10px;padding:10px 14px;font-weight:700}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.warn{background:var(--tomato);color:#fff}
.del{background:none;border:0;color:var(--muted);width:32px;height:32px}
.notes{font-size:.88rem;color:var(--muted);margin-top:16px;display:flex;flex-direction:column;gap:6px}

/* settings */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700}
.storelist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.storerow{display:flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:10px;padding:4px 4px 4px 12px}
.storerow span{flex:1;font-weight:700}
.storerow button{width:38px;height:38px;border:0;background:none;border-radius:8px}

/* recipe sheet */
.sheet[hidden]{display:none}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,20,15,.45)}
.sheet .inner{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 10px}
.sheet h2{font-size:1.35rem;text-wrap:balance}
.ing{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ing td{padding:7px 0;border-bottom:1px solid var(--line)}
.ing td.g{text-align:right;white-space:nowrap;padding-left:10px}
.ing th{text-align:right;font-size:.75rem;color:var(--muted);font-weight:700;padding-bottom:4px}
.ing th:first-child{text-align:left}
.steps{padding-left:22px;margin:6px 0 0}
.steps li{margin-bottom:8px}
.phase{font-weight:700;color:var(--amber);margin-top:10px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.74rem;font-weight:700;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.empty{padding:20px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){ .sheet .inner{animation:up .22s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}} }
</style>

</head><body>
<div class="app">
  <header class="top">
    <div><div class="eyebrow" id="hdrEyebrow">Heute</div><h1 id="hdrTitle">Essensplan</h1></div>
    <div class="sync" id="sync"><span class="dot"></span><span>lokal</span></div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Bereiche"><div class="wrap">
  <button data-tab="heute" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Heute</button>
  <button data-tab="woche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
  <button data-tab="einkauf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.4 11h11l2-8H6.2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>Einkauf</button>
  <button data-tab="vorrat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h16v12H4z"/><path d="M3 4h18v4H3zM10 12h4"/></svg>Vorrat</button>
  <button data-tab="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Mehr</button>

<script type="application/json" id="trainingdata">{"phases":{"1":{"n":"Einstieg","rir":"3 Wdh. Reserve","note":"Technik vor Gewicht. Wähle das Gewicht so, dass du am Ende jedes Satzes noch etwa 3 saubere Wiederholungen schaffen würdest. Trag dein Gewicht ein, das ist deine Basis für die nächsten Wochen."},"2":{"n":"Aufbau","rir":"2 Wdh. Reserve","note":"Bei den Hauptübungen kommt ein Satz dazu. Schaffst du am oberen Ende der Wiederholungen alle Sätze sauber, nimm beim nächsten Mal 1–2,5 kg mehr."},"3":{"n":"Steigerung","rir":"1–2 Wdh. Reserve","note":"Etwas schwerer als in Woche 2, die Sätze werden fordernd. Technik bleibt sauber, kein Schwung, der untere Rücken bleibt neutral."},"4":{"n":"Entlastung","rir":"4 Wdh. Reserve","note":"Deload: weniger Sätze und ca. 20 % weniger Gewicht als in Woche 3. Der Körper erholt sich und wird stärker. Danach startet Woche 1 mit etwas mehr Gewicht als beim letzten Mal."}},"warmup":{"n":"Aufwärmen (ca. 6 Min.)","items":["2 Min. locker auf der Stelle gehen oder Hampelmann","10× Armkreisen vorwärts und rückwärts","10× Katze-Kuh im Vierfüßlerstand","10× Hüftkreisen je Richtung","10× Glute Bridge (Becken heben)","1–2 leichte Aufwärmsätze der ersten Übung mit ca. 50 % des Arbeitsgewichts"]},"days":{"0":"push","1":"pull","3":"legs","5":"core"},"workouts":{"push":{"n":"Brust & Arme","dur":55,"ex":[{"id":"kh_bank","n":"Kurzhantel-Bankdrücken","sets":[3,4,4,2],"reps":"8–10","rest":90,"kg":true,"eq":"Kurzhanteln, Bank flach","how":["Auf die Bank legen, Füße fest am Boden, Schulterblätter nach hinten-unten ziehen.","Hanteln über der Brust, Handflächen Richtung Füße.","Kontrolliert absenken, bis die Ellbogen etwas unter Bankhöhe sind (ca. 45° zum Körper).","Kraftvoll hochdrücken, oben nicht ganz durchstrecken."],"tip":"Kein Hohlkreuz: Po bleibt auf der Bank.","start":12,"step":2,"rmin":8,"rmax":10,"bar":false,"mus":"Brust · vordere Schulter · Trizeps"},{"id":"kh_schraeg","n":"Schrägbankdrücken mit Kurzhanteln","sets":[3,3,3,2],"reps":"10–12","rest":90,"kg":true,"eq":"Kurzhanteln, Bank ca. 30°","how":["Bank auf ca. 30° stellen.","Ausführung wie beim Bankdrücken, Hanteln senken sich Richtung obere Brust.","Oben die Hanteln leicht zueinander führen."],"tip":"Nicht steiler als 30–45°, sonst arbeitet vor allem die Schulter.","start":10,"step":2,"rmin":10,"rmax":12,"bar":false,"mus":"obere Brust · vordere Schulter · Trizeps"},{"id":"kh_fly","n":"Kurzhantel-Fliegende","sets":[2,3,3,2],"reps":"12–15","rest":60,"kg":true,"eq":"Kurzhanteln, Bank flach","how":["Rückenlage, Hanteln über der Brust, Arme leicht gebeugt.","In einem weiten Bogen seitlich absenken, bis du eine Dehnung in der Brust spürst.","Im gleichen Bogen zurück nach oben."],"tip":"Leichtes Gewicht, der Ellbogenwinkel bleibt gleich.","start":6,"step":1,"rmin":12,"rmax":15,"bar":false,"mus":"Brust (Dehnung und Spannung)"},{"id":"liegest","n":"Liegestütze","sets":[2,2,3,2],"reps":"so viele wie sauber möglich, minus 2","rest":60,"kg":false,"eq":"Ab Woche 3 mit Gewichtsweste","how":["Hände etwas breiter als schulterbreit, Körper bildet eine Linie.","Brust kontrolliert Richtung Boden, Ellbogen ca. 45°.","Hochdrücken, Bauch und Po bleiben angespannt."],"tip":"Zu schwer? Hände auf die Bank. Zu leicht? Gewichtsweste anziehen.","bar":false,"mus":"Brust · Trizeps · vordere Schulter · Rumpf"},{"id":"sz_curl","n":"SZ-Curls","sets":[3,3,4,2],"reps":"10–12","rest":60,"kg":true,"eq":"SZ-Stange","how":["Aufrecht stehen, SZ-Stange im Untergriff schulterbreit.","Ellbogen bleiben an der Seite, Stange zur Brust beugen.","Langsam (2–3 Sek.) ablassen."],"tip":"Kein Schwung aus dem Rücken.","start":15,"step":2.5,"rmin":10,"rmax":12,"bar":true,"mus":"Bizeps"},{"id":"hammer","n":"Hammer-Curls","sets":[2,3,3,2],"reps":"12","rest":60,"kg":true,"eq":"Kurzhanteln","how":["Hanteln im neutralen Griff (Daumen nach vorn).","Abwechselnd oder gleichzeitig hochbeugen, Oberarm bleibt ruhig."],"tip":"Trainiert auch den Unterarm.","start":8,"step":1,"rmin":12,"rmax":12,"bar":false,"mus":"Bizeps · Oberarmmuskel (Brachialis) · Unterarm"},{"id":"sz_french","n":"SZ-French-Press (liegend)","sets":[3,3,4,2],"reps":"10–12","rest":60,"kg":true,"eq":"SZ-Stange, Bank","how":["Rückenlage auf der Bank, SZ-Stange mit gestreckten Armen über der Brust.","Nur die Unterarme bewegen: Stange Richtung Stirn/hinter den Kopf absenken.","Oberarme bleiben fast senkrecht, wieder strecken."],"tip":"Lieber leichter anfangen, schont die Ellbogen.","start":12.5,"step":2.5,"rmin":10,"rmax":12,"bar":true,"mus":"Trizeps (v. a. langer Kopf)"},{"id":"tri_band","n":"Trizeps-Strecken mit Band","sets":[2,2,3,2],"reps":"15","rest":45,"kg":false,"eq":"Widerstandsband (oben befestigt)","how":["Band oben (z. B. Türanker) befestigen, Enden greifen.","Ellbogen am Körper, Unterarme nach unten strecken.","Langsam zurück."],"tip":"Alternativ: Kurzhantel-Kickbacks.","rmin":15,"rmax":15,"bar":false,"mus":"Trizeps"}]},"pull":{"n":"Rücken & Schultern","dur":55,"ex":[{"id":"lh_rudern","n":"Langhantel-Rudern vorgebeugt","sets":[3,4,4,2],"reps":"8–10","rest":90,"kg":true,"eq":"Langhantel","how":["Hüftbreit stehen, Knie leicht gebeugt, Oberkörper ca. 45° nach vorn, Rücken gerade.","Stange schulterbreit im Obergriff, Arme hängen.","Stange zum Bauchnabel ziehen, Schulterblätter zusammen.","Kontrolliert ablassen."],"tip":"Unterer Rücken bleibt neutral. Bei Ziehen im Rücken: leichter oder einarmig an der Bank rudern.","start":30,"step":2.5,"rmin":8,"rmax":10,"bar":true,"mus":"oberer und mittlerer Rücken · Latissimus · hintere Schulter · Bizeps"},{"id":"kh_rudern1","n":"Einarmiges Kurzhantel-Rudern","sets":[3,3,4,2],"reps":"10–12 je Seite","rest":60,"kg":true,"eq":"Kurzhantel, Bank","how":["Knie und Hand einer Seite auf die Bank, Rücken flach.","Hantel Richtung Hüfte ziehen, Ellbogen nah am Körper.","Unten kurz ganz strecken."],"tip":"Schont den unteren Rücken, weil du dich abstützt.","start":14,"step":2,"rmin":10,"rmax":12,"bar":false,"mus":"Latissimus · mittlerer Rücken · Bizeps","one":true},{"id":"pullover","n":"Kurzhantel-Pullover","sets":[2,3,3,2],"reps":"12","rest":60,"kg":true,"eq":"Kurzhantel, Bank","how":["Rückenlage auf der Bank, eine Hantel mit beiden Händen über der Brust.","Mit leicht gebeugten Armen in einem Bogen hinter den Kopf absenken.","Zurück über die Brust ziehen."],"tip":"Ersetzt den Latzug. Bauch anspannen, kein Hohlkreuz.","start":10,"step":2,"rmin":12,"rmax":12,"bar":false,"mus":"Latissimus · Brust · Trizeps (langer Kopf)","one":true},{"id":"schulterdr","n":"Kurzhantel-Schulterdrücken sitzend","sets":[3,4,4,2],"reps":"8–10","rest":90,"kg":true,"eq":"Kurzhanteln, Bank aufrecht","how":["Bank fast senkrecht, Rücken angelehnt.","Hanteln auf Schulterhöhe, Handflächen nach vorn.","Über den Kopf drücken, oben nicht ganz durchstrecken, langsam zurück."],"tip":"Rippen unten halten, nicht ins Hohlkreuz drücken.","start":8,"step":2,"rmin":8,"rmax":10,"bar":false,"mus":"vordere und seitliche Schulter · Trizeps"},{"id":"seitheben","n":"Seitheben","sets":[3,3,4,2],"reps":"12–15","rest":60,"kg":true,"eq":"Kurzhanteln","how":["Aufrecht, Hanteln seitlich, Arme leicht gebeugt.","Seitlich bis Schulterhöhe heben, kleine Finger leicht oben.","2 Sek. ablassen."],"tip":"Leicht nehmen, kein Schwung.","start":4,"step":1,"rmin":12,"rmax":15,"bar":false,"mus":"seitliche Schulter"},{"id":"reverse_fly","n":"Reverse Flys vorgebeugt","sets":[2,3,3,2],"reps":"15","rest":60,"kg":true,"eq":"Kurzhanteln (oder auf der Schrägbank liegend)","how":["Bauchlage auf der Schrägbank oder vorgebeugt mit geradem Rücken.","Arme leicht gebeugt seitlich anheben, Schulterblätter zusammen."],"tip":"Auf der Bank liegend ist es rückenschonender.","start":4,"step":1,"rmin":15,"rmax":15,"bar":false,"mus":"hintere Schulter · oberer Rücken (Rhomboiden, Trapez)"},{"id":"facepull","n":"Face Pulls mit Band","sets":[2,3,3,2],"reps":"15","rest":45,"kg":false,"eq":"Widerstandsband auf Kopfhöhe","how":["Band auf Kopfhöhe befestigen, Enden greifen.","Richtung Stirn ziehen, Ellbogen hoch und nach außen.","Kurz halten, langsam zurück."],"tip":"Gut für Haltung und gesunde Schultern.","rmin":15,"rmax":15,"bar":false,"mus":"hintere Schulter · Rotatorenmanschette · oberer Rücken"}]},"legs":{"n":"Beine","dur":55,"ex":[{"id":"goblet","n":"Goblet Squat","sets":[3,4,4,2],"reps":"10–12","rest":90,"kg":true,"eq":"Kurzhantel, ab Woche 2 zusätzlich Gewichtsweste möglich","how":["Schulterbreit stehen, eine Hantel senkrecht vor der Brust halten.","Hüfte nach hinten-unten, Knie zeigen über die Zehen.","So tief wie mit geradem Rücken möglich, Fersen bleiben am Boden.","Über die ganze Fußsohle hochdrücken."],"tip":"Brust bleibt aufgerichtet. Wird die Hantel zu schwer zum Halten, Weste dazu nehmen.","start":14,"step":2,"rmin":10,"rmax":12,"bar":false,"mus":"vordere Oberschenkel · Po · Rumpf","one":true},{"id":"rdl","n":"Rumänisches Kreuzheben (Langhantel)","sets":[3,4,4,2],"reps":"8–10","rest":90,"kg":true,"eq":"Langhantel","how":["Hüftbreit stehen, Stange vor den Oberschenkeln, Knie leicht gebeugt.","Hüfte nach hinten schieben, Stange gleitet eng an den Beinen nach unten.","Absenken bis kurz unter die Knie oder bis zur Dehnung hinten im Oberschenkel, Rücken bleibt gerade.","Hüfte nach vorn schieben und aufrichten, oben Po anspannen."],"tip":"Wichtigste Regel: neutraler Rücken. Lieber weniger tief als rund. Bei Rückenschmerz abbrechen.","start":30,"step":2.5,"rmin":8,"rmax":10,"bar":true,"mus":"hintere Oberschenkel · Po · unterer Rücken (Rückenstrecker)"},{"id":"bulgar","n":"Bulgarische Split Squats","sets":[2,3,3,2],"reps":"8–10 je Bein","rest":75,"kg":true,"eq":"Kurzhanteln, Bank","how":["Hinteren Fuß auf die Bank legen, vorderer Fuß ca. ein großer Schritt vor der Bank.","Senkrecht nach unten absenken, bis das hintere Knie fast den Boden berührt.","Über die vordere Ferse hochdrücken."],"tip":"Anfangs ohne Gewicht, Gleichgewicht kommt schnell.","start":6,"step":2,"rmin":8,"rmax":10,"bar":false,"mus":"vordere Oberschenkel · Po"},{"id":"hipthrust","n":"Hip Thrust mit Langhantel","sets":[3,3,4,2],"reps":"10–12","rest":75,"kg":true,"eq":"Langhantel, Bank (Polster oder Handtuch um die Stange)","how":["Oberer Rücken an der Bankkante, Stange auf der Hüfte, Füße hüftbreit.","Hüfte hochdrücken, bis Oberkörper und Oberschenkel eine Linie bilden.","Oben 1 Sek. Po anspannen, Kinn leicht zur Brust."],"tip":"Stärkt den Po und entlastet damit den unteren Rücken.","start":30,"step":5,"rmin":10,"rmax":12,"bar":true,"mus":"Po (großer Gesäßmuskel) · hintere Oberschenkel"},{"id":"waden","n":"Wadenheben stehend","sets":[3,3,4,2],"reps":"15–20","rest":45,"kg":true,"eq":"Kurzhanteln, ggf. Stufe","how":["Mit den Fußballen auf einer Stufe, Fersen frei.","Ganz nach oben drücken, kurz halten, langsam tief absenken."],"tip":"Volle Bewegung statt schnell wippen.","start":12,"step":2,"rmin":15,"rmax":20,"bar":false,"mus":"Waden"},{"id":"band_walk","n":"Seitliches Gehen mit Band","sets":[2,2,3,2],"reps":"15 Schritte je Seite","rest":30,"kg":false,"eq":"Miniband über den Knien","how":["Band über den Knien, leichte Kniebeuge.","Seitlich gehen, Spannung im Band halten, Knie zeigen nach außen."],"tip":"Kräftigt den seitlichen Po, gut für Knie und Hüfte.","rmin":15,"rmax":15,"bar":false,"mus":"seitlicher Po (mittlerer Gesäßmuskel)"}]},"core":{"n":"Ganzkörper leicht & Core","dur":35,"circuit":true,"rounds":[2,3,3,2],"note":"Zirkel: Alle Übungen nacheinander, 15 Sek. Pause zwischen den Übungen, 90 Sek. Pause nach jeder Runde.","ex":[{"id":"plank","n":"Unterarmstütz (Plank)","reps":"30–45 Sek.","kg":false,"eq":"Matte, ab Woche 3 Gewichtsweste möglich","how":["Unterarme unter den Schultern, Körper bildet eine Linie.","Bauch und Po anspannen, ruhig weiteratmen."],"tip":"Hüfte nicht durchhängen lassen.","bar":false,"mus":"gerader und querer Bauchmuskel · Rumpf"},{"id":"seitstuetz","n":"Seitstütz","reps":"20–30 Sek. je Seite","kg":false,"eq":"Matte","how":["Seitlich auf den Unterarm, Füße übereinander.","Hüfte anheben, Körper gerade."],"tip":"Zu schwer: unteres Knie aufsetzen.","bar":false,"mus":"seitliche Bauchmuskeln · seitlicher Po"},{"id":"deadbug","n":"Dead Bug","reps":"8–10 je Seite","kg":false,"eq":"Matte","how":["Rückenlage, Arme zur Decke, Knie 90° gebeugt über der Hüfte.","Rechten Arm und linkes Bein langsam ausstrecken, unterer Rücken bleibt am Boden.","Zurück und Seite wechseln."],"tip":"Sehr gut für den unteren Rücken.","bar":false,"mus":"tiefe Bauchmuskeln · Rumpfstabilität"},{"id":"birddog","n":"Bird Dog","reps":"8–10 je Seite","kg":false,"eq":"Matte","how":["Vierfüßlerstand, Rücken flach.","Rechten Arm und linkes Bein strecken, 2 Sek. halten.","Zurück und Seite wechseln."],"tip":"Becken bleibt waagerecht.","bar":false,"mus":"Rückenstrecker · Po · Rumpfstabilität"},{"id":"bridge","n":"Glute Bridge","reps":"15","kg":false,"eq":"Matte, optional Kurzhantel auf der Hüfte","how":["Rückenlage, Füße aufgestellt.","Becken anheben bis zur Linie Knie-Hüfte-Schulter, Po anspannen."],"tip":"Aus dem Po drücken, nicht aus dem Rücken.","bar":false,"mus":"Po · hintere Oberschenkel"},{"id":"thruster","n":"Kurzhantel-Thruster (leicht)","reps":"12","kg":true,"eq":"Kurzhanteln","how":["Hanteln auf den Schultern, in die Kniebeuge.","Beim Aufstehen die Hanteln in einer Bewegung über den Kopf drücken."],"tip":"Leicht wählen, es geht um Bewegung und Puls.","start":6,"bar":false,"mus":"Beine · Po · Schultern (Ganzkörper)"},{"id":"russian","n":"Russian Twist","reps":"16 (8 je Seite)","kg":true,"eq":"Kurzhantel oder ohne Gewicht","how":["Sitzend, Oberkörper leicht zurück, Rücken gerade, Füße am Boden.","Oberkörper mit der Hantel abwechselnd nach links und rechts drehen."],"tip":"Bei Rückenproblemen Füße am Boden lassen.","start":4,"bar":false,"mus":"seitliche Bauchmuskeln","one":true},{"id":"farmer","n":"Farmer’s Walk","reps":"40 Sek.","kg":true,"eq":"2 schwere Kurzhanteln","how":["In jeder Hand eine schwere Hantel, aufrecht stehen.","Mit kleinen Schritten gehen, Schultern unten, Bauch fest."],"tip":"Trainiert Griff, Rumpf und Haltung.","start":16,"bar":false,"mus":"Griffkraft · Unterarm · Trapez · Rumpf"},{"id":"revcrunch","n":"Reverse Crunch","reps":"12","kg":false,"eq":"Matte","how":["Rückenlage, Beine angewinkelt angehoben, Hände neben dem Körper.","Becken leicht vom Boden rollen und Knie Richtung Brust ziehen.","Langsam zurück."],"tip":"Ohne Schwung, rückenschonender als Sit-ups.","bar":false,"mus":"unterer Bauch"}]}},"stretch":{"post_push":{"n":"Dehnen nach Brust & Arme","dur":8,"items":["katzekuh","tuer_brust","trizeps_d","bizeps_d","kind"]},"post_pull":{"n":"Dehnen nach Rücken & Schultern","dur":8,"items":["katzekuh","kind_seit","schulter_quer","nacken","offenes_buch"]},"post_legs":{"n":"Dehnen nach Beine","dur":10,"items":["hueftbeuger","quad","ham_band","taube","wade","knie_brust"]},"post_core":{"n":"Dehnen nach Ganzkörper","dur":8,"items":["katzekuh","kobra","drehsitz","hueftbeuger","kind"]},"rest":{"n":"Ganzkörper-Dehnen mit Fokus unterer Rücken","dur":15,"items":["katzekuh","kind","knie_brust","drehsitz","taube","hueftbeuger","ham_band","offenes_buch","tuer_brust","nacken","kobra"]}},"stretches":{"katzekuh":{"n":"Katze-Kuh","dur":"10 langsame Wiederholungen","how":"Vierfüßlerstand. Beim Ausatmen den Rücken rund machen und das Kinn zur Brust, beim Einatmen das Brustbein nach vorn und leicht ins Hohlkreuz. Langsam und im Atemrhythmus.","mus":"gesamte Wirbelsäule · unterer Rücken (Mobilisation)"},"kind":{"n":"Kindhaltung","dur":"60 Sek.","how":"Aus dem Vierfüßlerstand den Po Richtung Fersen schieben, Arme lang nach vorn, Stirn ablegen. Tief in den unteren Rücken atmen.","mus":"unterer Rücken · Latissimus · Po"},"kind_seit":{"n":"Kindhaltung mit Seitneigung","dur":"30 Sek. je Seite","how":"In der Kindhaltung beide Hände nach rechts wandern lassen, bis du die linke Flanke spürst. Seite wechseln.","mus":"Latissimus · seitliche Rumpfmuskeln"},"knie_brust":{"n":"Knie zur Brust","dur":"45 Sek.","how":"Rückenlage, beide Knie mit den Händen zur Brust ziehen, unteren Rücken lang machen. Leicht hin und her schaukeln ist erlaubt.","mus":"unterer Rücken · Po"},"drehsitz":{"n":"Liegender Drehsitz","dur":"45 Sek. je Seite","how":"Rückenlage, rechtes Knie angewinkelt über das linke Bein zur linken Seite fallen lassen, Arme seitlich, Blick nach rechts. Schultern bleiben am Boden.","mus":"unterer Rücken · seitlicher Rumpf · Po"},"taube":{"n":"Liegende Taube (Piriformis)","dur":"45 Sek. je Seite","how":"Rückenlage, rechten Knöchel aufs linke Knie legen, linken Oberschenkel zu dir ziehen. Dehnung im rechten Po.","mus":"Po (Piriformis) · Hüfte außen"},"hueftbeuger":{"n":"Hüftbeuger-Dehnung im Halbknie","dur":"45 Sek. je Seite","how":"Rechtes Knie am Boden (Kissen unterlegen), linker Fuß vorn. Po anspannen und Becken leicht nach vorn schieben, Oberkörper aufrecht. Wichtig gegen Zug im unteren Rücken vom Sitzen.","mus":"Hüftbeuger (Iliopsoas) · vordere Oberschenkel"},"ham_band":{"n":"Hintere Oberschenkel mit Band","dur":"45 Sek. je Seite","how":"Rückenlage, Band um den rechten Fuß, Bein möglichst gestreckt Richtung Decke ziehen, das andere Bein liegt lang am Boden.","mus":"hintere Oberschenkel"},"quad":{"n":"Vordere Oberschenkel","dur":"30 Sek. je Seite","how":"Stehend (an der Wand festhalten) die rechte Ferse Richtung Po ziehen, Knie zeigen nach unten, Po anspannen.","mus":"vordere Oberschenkel"},"wade":{"n":"Wadendehnung an der Wand","dur":"30 Sek. je Seite","how":"Hände an die Wand, rechtes Bein lang nach hinten, Ferse in den Boden drücken.","mus":"Waden"},"tuer_brust":{"n":"Brustdehnung im Türrahmen","dur":"30 Sek. je Seite","how":"Unterarm auf Schulterhöhe an den Türrahmen, mit dem Oberkörper leicht nach vorn und weg drehen, bis die Brust zieht.","mus":"Brust · vordere Schulter"},"trizeps_d":{"n":"Trizepsdehnung","dur":"30 Sek. je Seite","how":"Rechten Arm über den Kopf, Hand zwischen die Schulterblätter, mit der linken Hand den Ellbogen sanft nach hinten ziehen.","mus":"Trizeps"},"bizeps_d":{"n":"Bizepsdehnung an der Wand","dur":"30 Sek. je Seite","how":"Handfläche auf Schulterhöhe an die Wand, Arm gestreckt, Oberkörper langsam von der Wand weg drehen.","mus":"Bizeps · Unterarm"},"schulter_quer":{"n":"Schulter quer vor dem Körper","dur":"30 Sek. je Seite","how":"Rechten Arm gestreckt vor der Brust zur linken Seite führen, mit dem linken Unterarm sanft heranziehen.","mus":"hintere Schulter · oberer Rücken"},"nacken":{"n":"Seitliche Nackendehnung","dur":"30 Sek. je Seite","how":"Aufrecht sitzen, Kopf zur rechten Schulter neigen, linke Schulter aktiv nach unten. Optional rechte Hand sanft auf den Kopf.","mus":"Nacken (oberer Trapez)"},"offenes_buch":{"n":"Offenes Buch (Brustwirbelsäule)","dur":"8× je Seite","how":"Seitlage, Knie 90° gebeugt, Arme vorn gestreckt. Oberen Arm in einem Bogen nach hinten öffnen, Blick folgt der Hand, Knie bleiben zusammen.","mus":"Brustwirbelsäule · Brust (Mobilisation)"},"kobra":{"n":"Sanfte Kobra","dur":"3× 15 Sek.","how":"Bauchlage, Hände unter den Schultern, Oberkörper nur so weit aufrichten, wie es angenehm ist, Hüfte bleibt am Boden. Bei Schmerzen weglassen.","mus":"Bauch · Hüftbeuger · Wirbelsäule (Streckung)"}}}</script>
<script type="application/json" id="plandata">{"dishes":{"W1_F_MO":{"w":1,"n":"Protein-Pancakes mit Beerenkompott","m":"Frühstück","por":1,"kcal":502,"p":33.1,"f":14.1,"kh":56.3,"t":20,"z":"Am Vorabend (Sonntag): 1) Haferflocken fein mahlen, mit Quark, Ei, zerdrückter Banane, 1 TL Backpulver und 1 Prise Zimt verrühren. 2) In wenig Rapsöl 4–5 kleine Pancakes je 2–3 Min. pro Seite backen, abkühlen lassen und in eine Box legen. 3) Beeren mit 2 EL Wasser 3 Min. erwärmen, Ahornsirup unterrühren und in ein Schraubglas füllen. Beides kühlen. Vor Ort: Pancakes 1 Min. in der Mikrowelle erwärmen, Kompott darübergeben.","mo":0,"va":20,"ing":[["Haferflocken",45],["Magerquark",150],["Ei",60],["Banane",50],["Rapsöl",4],["Beeren (TK-Mischung)",100],["Ahornsirup",8],["Zimt",0.3],["Backpulver",4.0]]},"W1_F_DI":{"w":1,"n":"Rührei-Spinat-Wrap mit Feta","m":"Frühstück","por":1,"kcal":521,"p":31.9,"f":26.2,"kh":34.6,"t":12,"z":"Am Vorabend: 1) Spinat mit etwas Öl 1 Min. zusammenfallen lassen. 2) Eier mit Hüttenkäse, Salz und Pfeffer verquirlen, zum Spinat geben und cremig stocken lassen, abkühlen. 3) Tortilla mit Rührei, Feta und Tomatenwürfeln füllen, fest einrollen, in Backpapier wickeln und kühlen. Vor Ort: im Backpapier 1–2 Min. in der Mikrowelle erwärmen.","mo":0,"va":12,"ing":[["Vollkorn-Tortilla",60],["Ei",120],["Hüttenkäse",50],["Feta",25],["Blattspinat",50],["Tomate",60],["Rapsöl",3],["Salz",1.0],["Pfeffer (gemahlen)",0.3]]},"W1_F_MI":{"w":1,"n":"Baked Oats mit Apfel-Zimt","m":"Frühstück","por":1,"kcal":505,"p":35.1,"f":15.9,"kh":51.0,"t":30,"z":"Am Vorabend, gern parallel zum Abendessen im Ofen: 1) Ofen auf 180 °C vorheizen. 2) Apfel raspeln. Haferflocken, Quark, Ei, Milch, 1 TL Backpulver, 1 TL Zimt und Honig verrühren, Apfel unterheben. 3) In eine kleine ofenfeste Glasbox füllen, Walnüsse darüberstreuen und 25 Min. backen. 4) Abkühlen lassen, Deckel drauf, kühlen. Vor Ort: 1–2 Min. in der Mikrowelle erwärmen oder kalt essen.","mo":0,"va":30,"ing":[["Haferflocken",40],["Mager schung)",100],["Zimt",0.5]]},"W1_D_START":{"w":1,"n":"Gefüllte Paprika mit Putenhack und Bulgur","m":"Hauptgericht","por":2,"kcal":548,"p":41.3,"f":16.8,"kh":52.8,"t":45,"z":"Mengen für 2 Portionen kochen. 1) Bulgur nach Packungsanweisung garen (ca. 10 Min.). Ofen auf 200 °C vorheizen. 2) Zwiebel würfeln, in Olivenöl glasig dünsten, Putenhack 5 Min. krümelig braten, würzen (Salz, Pfeffer, Paprikapulver, Oregano). 3) Bulgur untermischen. Paprika halbieren, entkernen und füllen. 4) Passierte Tomaten in eine Form geben, Paprikahälften hineinsetzen, mit Mozzarella belegen. 5) 25–30 Min. backen.","mo":null,"va":null,"ing":[["Paprika",200],["Putenhack",130],["Bulgur (trocken)",55],["Zwiebel",30],["Passierte Tomaten",100],["Mozzarella",20],["Olivenöl",5],["Salz",1.0],["Pfeffer (gemahlen)",0.3],["Paprikapulver (edelsüß)",1.0],["Oregano (getrocknet)",0.3]]},"W1_D_MO":{"w":1,"n":"Hähnchen-Cacciatore mit Vollkornpenne","m":"Hauptgericht","por":2,"kcal":550,"p":44.0,"f":14.5,"kh":56.3,"t":35,"z":"Mengen für 2 Portionen kochen. 1) Hähnchen in Stücke schneiden, salzen und in Olivenöl rundum anbraten, herausnehmen. 2) Zwiebel, Knoblauch und Paprika im Bratfett 4 Min. anschwitzen, passierte Tomaten, Oliven, Oregano und Rosmarin zugeben. 3) Hähnchen zurück in die Pfanne geben, 15 Min. köcheln lassen. 4) Penne nach Packungsanweisung garen und untermischen.","mo":null,"va":null,"ing":[["Hähnchenbrust",140],["Vollkornnudeln (trocken)",60],["Passierte Tomaten",150],["Paprika",100],["Zwiebel",40],["Schwarze Oliven",15],["Olivenöl",8],["Knoblauch",4],["Salz",1.0],["Oregano (getrocknet)",0.3],["Rosmarin (getrocknet)",0.5]]},"W1_D_DI":{"w":1,"n":"Ofenlachs mit Kräuter-Skyr, Ofenkartoffeln und grünen Bohnen","m":"Hauptgericht","por":2,"kcal":581,"p":41.0,"f":23.6,"kh":48.8,"t":45,"z":"Mengen für 2 Portionen kochen. 1) Ofen auf 200 °C vorheizen. Kartoffeln in Spalten schneiden, mit der Hälfte des Öls, Salz und Rosmarin mischen und 30 Min. backen. 2) Lachs mit Zitronensaft, Salz und Pfeffer wü ungsanweisung garen. 2) Pute in Streifen schneiden, salzen und in Olivenöl scharf anbraten, herausnehmen. 3) Zwiebel und Paprika in Streifen im Bratfett anbraten, Tomatenmark und Paprikapulver zugeben, mit 150 ml Wasser ablöschen und 8 Min. köcheln. 4) Pute zurückgeben, Skyr unterrühren (nicht mehr kochen), abschmecken.","mo":null,"va":null,"ing":[["Putenbrust",130],["Paprika",150],["Zwiebel",40],["Vollkornreis (trocken)",60],["Skyr",50],["Tomatenmark",15],["Olivenöl",6],["Salz",1.0],["Paprikapulver (edelsüß)",1.0]]},"W2_F_MO":{"w":2,"n":"Tofu-Rührei mit Gemüse auf Vollkornbrot","m":"Frühstück","por":1,"kcal":530,"p":35.2,"f":23.1,"kh":43.7,"t":15,"z":"Am Vorabend (Sonntag): 1) Tofu zerbröckeln. Paprika und Frühlingszwiebeln klein schneiden und in Rapsöl 3 Min. anbraten. 2) Tofu, ½ TL Kurkuma, Salz und Pfeffer zugeben und 4 Min. braten. 3) Ei verquirlen, unterrühren und stocken lassen, mit Sojasauce abschmecken. 4) Abkühlen lassen und in eine Box füllen, Brot separat einpacken. Vor Ort: 1½ Min. in der Mikrowelle erwärmen und mit dem Brot essen.","mo":0,"va":15,"ing":[["Tofu (natur)",150],["Ei",60],["Paprika",60],["Frühlingszwiebeln",20],["Vollkornbrot",90],["Rapsöl",5],["Salz",1.0],["Pfeffer (gemahlen)",0.3],["Kurkuma (gemahlen)",1.5],["Sojasauce",10]]},"W2_F_DI":{"w":2,"n":"Tamagoyaki-Bowl mit Reis, Edamame und Lachs","m":"Frühstück","por":1,"kcal":551,"p":37.9,"f":27.8,"kh":34.4,"t":25,"z":"Am Vorabend (Reis am besten zusammen mit dem Abendessen kochen): 1) Reis nach Packungsanweisung garen und flach ausgebreitet zügig abkühlen lassen. 2) Eier mit 1 Schuss Sojasauce verquirlen, in einer beschichteten Pfanne mit wenig Öl in dünnen Schichten stocken lassen und dabei aufrollen, in Scheiben schneiden. 3) Edamame 3 Min. in heißem Wasser garen. 4) Alles mit dem Räucherlachs in eine Box packen und kühlen. Vor Ort: kalt essen oder Reis und Omelett ohne Lachs 1 Min. erwärmen.","mo":0,"va":20,"ing":[["Ei",180],["Vollkornreis (trocken)",40],["Edamame (TK)",50],["Räucherlachs d abkühlen lassen. 3) Erdnussmus mit Skyr und 1 EL Wasser zu einem Dip verrühren. Gurke in Sticks schneiden und alles zusammen in eine Box packen. Schmeckt kalt.","mo":0,"va":15,"ing":[["Tofu (natur)",120],["Sesam",5],["Sojasauce",5],["Erdnussmus",8],["Skyr",40],["Gurke",60],["Rapsöl",3]]},"W2_FS_MI":{"w":2,"n":"Sommerrollen-Wrap mit Erdnuss-Dip","m":"Frühsnack","por":1,"kcal":312,"p":23.9,"f":8.5,"kh":32.9,"t":10,"z":"Morgens (8 Min.): 1) Möhre und Gurke in feine Streifen schneiden. 2) Erdnussmus mit Skyr, Limettensaft und etwas Sojasauce verrühren. 3) Tortilla mit dem Dip bestreichen, mit Putenaufschnitt und Gemüse belegen, fest einrollen und in Backpapier wickeln.","mo":8,"va":0,"ing":[["Vollkorn-Tortilla",50],["Putenbrust-Aufschnitt",60],["Möhre",50],["Gurke",60],["Erdnussmus",8],["Skyr",40],["Limette",10],["Sojasauce",10]]},"W2_FS_DO":{"w":2,"n":"Edamame-Guacamole auf Knäckebrot","m":"Frühsnack","por":1,"kcal":288,"p":18.1,"f":10.5,"kh":25.4,"t":10,"z":"Am Vorabend: Edamame aus dem Tiefkühler in den Kühlschrank legen. Morgens (10 Min.): 1) Edamame mit Avocado, Limettensaft, Salz und Pfeffer grob zerdrücken. 2) Hüttenkäse unterrühren und in ein Glas füllen. 3) Knäckebrot separat einpacken und vor Ort bestreichen.","mo":10,"va":0,"ing":[["Edamame (TK)",60],["Avocado",30],["Knäckebrot (Vollkorn)",30],["Hüttenkäse",60],["Limette",10],["Salz",1.0],["Pfeffer (gemahlen)",0.3]]},"W2_FS_FR":{"w":2,"n":"Süßkartoffel mit Limetten-Skyr","m":"Frühsnack","por":1,"kcal":303,"p":20.6,"f":3.9,"kh":44.1,"t":40,"z":"Am Vorabend (Donnerstag, parallel zum Milchreis): 1) Ofen auf 200 °C vorheizen. Süßkartoffel mit der Gabel einstechen und 35–40 Min. backen, dann abkühlen lassen. 2) Skyr mit Hüttenkäse, Limettensaft und Salz verrühren und separat in ein Glas füllen. Sesam dazupacken. Vor Ort: Süßkartoffel 2 Min. in der Mikrowelle erwärmen, aufschneiden, das Topping hineingeben und mit Sesam bestreuen.","mo":0,"va":10,"ing":[["Süßkartoffel",200],["Skyr",100],["Hüttenkäse",50],["Limett euen. 4) 25–30 Min. backen, abkühlen lassen, verschließen und kühlen. Schmeckt kalt am besten.","mo":0,"va":30,"ing":[["Magerquark",250],["Ei",60],["Haferflocken",30],["Zitrone",10],["Honig",6],["Beeren (TK-Mischung)",100],["Walnüsse",10]]},"W3_F_MI":{"w":3,"n":"Brotzeit mit Putenröllchen, Kräuterquark und Walnüssen","m":"Frühstück","por":1,"kcal":526,"p":45.3,"f":10.6,"kh":56.2,"t":8,"z":"Am Vorabend: 1) Quark mit Kräutern, Salz und Pfeffer verrühren. 2) Die Hälfte davon auf den Putenaufschnitt streichen, mit Gurkensticks belegen und aufrollen. 3) Röllchen, restlichen Kräuterquark und Walnüsse in eine Box geben und kühlen. Vollkornbrot und Knäckebrot separat einpacken. Vor Ort: Brot und Knäcke mit dem Quark bestreichen und zu den Röllchen essen.","mo":0,"va":8,"ing":[["Putenbrust-Aufschnitt",100],["Magerquark",120],["Gurke",100],["Knäckebrot (Vollkorn)",40],["Vollkornbrot",60],["Walnüsse",10],["Salz",1.0],["Pfeffer (gemahlen)",0.3],["Kräuter (frisch, gemischt)",5.0]]},"W3_F_DO":{"w":3,"n":"Bircher-Müsli mit Skyr und Walnuss","m":"Frühstück","por":1,"kcal":519,"p":33.2,"f":16.3,"kh":54.3,"t":7,"z":"Am Vorabend: Haferflocken mit Milch und Skyr in einem Schraubglas verrühren und kühlen. Morgens (4 Min.): 1) Apfel grob raspeln und mit Zitronensaft und Honig unterrühren. 2) Walnüsse hacken und darüberstreuen.","mo":4,"va":3,"ing":[["Haferflocken",45],["Apfel",100],["Skyr",200],["Milch 1,5 %",60],["Walnüsse",18],["Honig",5],["Zitrone",5]]},"W3_F_FR":{"w":3,"n":"Quarkkeulchen aus dem Ofen mit Apfelmus","m":"Frühstück","por":1,"kcal":542,"p":35.0,"f":17.6,"kh":56.5,"t":35,"z":"Am Vorabend (Donnerstag): 1) Kartoffeln kochen (oder Reste verwenden) und zerdrücken. 2) Mit Quark, Ei, Mehl und Honig zu einem Teig verkneten und 6 Küchlein formen. 3) Auf Backpapier mit Rapsöl bepinseln und bei 200 °C 18–20 Min. backen, dabei einmal wenden. 4) Währenddessen Apfel mit 2 EL Wasser und Zimt zu Apfelmus verkochen und in ein Glas füllen. Alles abkühlen lassen und einpacken. Vor Ort: Küc function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseISO(s){ const [y,m,dd]=s.split('-').map(Number); return new Date(y,m-1,dd); }

const DEFAULT = { start: nextMonday(), stores:['Aldi','Lidl','Rewe','Edeka','Markttreff','Markant'], v:2, assign:{}, checks:{}, home:{}, extra:{}, stock:{}, cooked:{}, bought:{}, autoStock:true, updated:0 };

function exportBackup(msgEl){
  const js=JSON.stringify(Object.assign({}, S, {app:'essensplan', exported:new Date().toISOString()}));
  const name='essensplan-sicherung-'+iso(new Date())+'.json';

    setTimeout(()=>URL.revokeObjectURL(url),4000);

function copyBackup(msgEl){

  const done=()=>{ if(msgEl) msgEl.textContent='Kopiert. Füge den Text z. B. in eine Notiz ein.'; };
  try{ navigator.clipboard.writeText(js).then(done,()=>{ if(msgEl) msgEl.textContent='Kopieren wurde blockiert.'; }); }catch(e){ if(msgEl) msgEl.textContent='Kopieren wurde blockiert.'; }

function applyBackup(text, msgEl){
  try{
    const j=JSON.parse(text);
    if(!j || !Array.isArray(j.stores) || typeof j.assign!=='object') throw new Error('x');
    S=Object.assign({}, DEFAULT, j); delete S.app; delete S.exported;
    recomputeAll(); persist(); render();
    const m=document.getElementById(msgEl); if(m) m.textContent='Sicherung geladen: '+Object.keys(S.assign).length+' Laden-Zuordnungen, '+S.stores.length+' Läden.';
  }catch(e){ const m=document.getElementById(msgEl); if(m) m.textContent='Die Datei ist keine gültige Essensplan-Sicherung.'; }
}
function importFromInput(input, msgId){
  const f=input.files && input.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>applyBackup(String(r.result), msgId); r.readAsText(f);
}

/* ---------- cloud sync via db (single document) ---------- */
let docRef=null, lastSent='', writeChain=Promise.resolve(), timer=null, dbOk=false;
function setSync(on, txt){ const el=$('#sync'); el.innerHTML='<span class="dot'+(on?' on':'')+'"></span><span>'+esc(txt)+'</span>'; }
function persist(){
  S.updated=Date.now(); saveLocal();
  if(!docRef) return;
  clearTimeout(timer);
  timer=setTimeout(()=>{
    const body=JSON.parse(JSON.stringify(S)); const js=JSON.stringify(body);
    writeChain = writeChain.then(()=>docRef.set(body)).then(()=>{ lastSent=js; setSync(true,'gespeichert'); })
      .catch(e=>{ setSync(false, e&&e.code==='invalid_argument'?'nur lokal':'offline, lokal gespeichert'); });
  },500);
}
async function initDb(){
  if(!window.claude || !window.claude.use){ setSync(true,'auf dem Handy gespeichert'); return; }
  let db=null; try{ db=await window.claude.use('db'); }catch(e){}
  if(!db){ setSync(false,'nur auf diesem Gerät'); return; }
  try{
    docRef=db.doc('state/main');
    const snap=await docRef.get();
    if(snap.exists){ const remote=snap.data(); if((remote.updated||0)>=(S.updated||0)){ S=Object.assign({},DEFAULT,JSON.parse(JSON.stringify(remote))); saveLocal(); render(); } else persist(); }
    else persist();
    dbOk=true; setSync(true,'synchronisiert');
    docRef.onSnapshot(sn=>{
      if(!sn.exists || sn.metadata.hasPendingWrites) return;
      const r=sn.data(); const js=JSON.stringify(r);
      if(js===lastSent || (r.updated||0)<=(S.updated||0)) return;
      S=Object.assign({},DEFAULT,JSON.parse(js)); saveLocal(); render();
    }, ()=>setSync(false,'lokal'));
  }catch(e){ docRef=null; setSync(false,'nur auf diesem Gerät'); }
}

/* ---------- plan helpers ---------- */
function cyclePos(date){
  const start=parseISO(S.start); const d=new Date(date); d.setHours(0,0,0,0);
  const diff=Math.round((d-start)/86400000);
  const idx=((diff%28)+28)%28;
  return {before: diff<0, diff, week:Math.floor(idx/7)+1, dow:idx%7};
}
function mealsFor(week, dayName){ return D.plan.filter(p=>p[0]===week && p[1]===dayName); }
function dayTotals(ms,date){ return ms.reduce((a,m)=>{ if(date && rowSkipped(m,date)) return a; const d=D.dishes[m[4]]; a.kcal+=d.kcal; a.p+=d.p; return a; },{kcal:0,p:0}); }
/* ---------- skip a meal in this week's occurrence ---------- */
function skipKey(date,meal){ return iso(date)+'|'+meal; }
function isSkipped(date,meal){ return !!(S.skips&&S.skips[skipKey(date,meal)]); }
function rowDate(m){ return addDays(cycleBase(m[0]),(m[0]-1)*7+DAYS.indexOf(m[1])); }
function lunchFromDinner(m){ return m[2]==='Mittagessen' && /aufwärmen/.test(m[5]||''); }
function rowSkipped(m,date){
  date=date||rowDate(m);
  if(isSkipped(date,m[2])) return 'self';
  if(lunchFromDinner(m) && isSkipped(addDays(date,-1),'Abendessen')) return 'dinner';
  return '';
}
function effPor(m,date){
  date=date||rowDate(m);
  if(rowSkipped(m,date)) return 0;
  if(m[2]==='Abendessen'){ let p=m[6]||2; if(p>1 && isSkipped(addDays(date,1),'Mittagessen')) p-=1; return p; }
  if(m[2]==='Mittagessen') return rowPor(m);
  return 1;
}
function toggleSkip(date,meal){ S.skips=S.skips||{}; const k=skipKey(date,meal); if(S.skips[k]) delete S.skips[k]; else S.skips[k]=true; recomputeAll(); persist(); }

function addDays(date,n){ const d=new Date(date); d.setDate(d.getDate()+n); return d; }
/* ---------- meal swaps within a week ---------- */
const BASE_PLAN=D.plan.map(p=>p.slice());
const SWAP_MEALS=['Frühstück','Frühsnack','Abendsnack','Abendessen'];
let EP=[];
function baseRow(w,di,meal){ return BASE_PLAN.find(p=>p[0]===w&&p[1]===DAYS[di]&&p[2]===meal); }
function swapGroup(meal,di){
  if(meal==='Abendessen') return [0,1,2,3,4,5,6];                 // Sunday dinner takes next week's Monday lunch with it
  if(meal==='Abendsnack') return [0,1,2,3,4,5,6];
  return di<=4?[0,1,2,3,4]:[5,6];                                   // quick weekday mornings stay on weekdays
}
function canSwap(meal,di){ return SWAP_MEALS.includes(meal) && swapGroup(meal,di).length>1; }
function permOf(w,meal){ const p=S.mealSwap&&S.mealSwap[w]&&S.mealSwap[w][meal]; return (Array.isArray(p)&&p.length===7)?p:[0,1,2,3,4,5,6]; }
function stripDay(h){ return (h||'').replace(/\s*\((?:So|Mo|Di|Mi|Do|Fr|Sa)\)/g,''); }
function rowPor(m){ return m[6] || (D.dishes[m[4]]&&D.dishes[m[4]].por) || 1; }
function buildEP(){
  const out=[];
  BASE_PLAN.forEach(p=>{
    const w=p[0], di=DAYS.indexOf(p[1]), meal=p[2]; const row=p.slice(0,6); row[6]=null; row[7]=false;
    if(meal==='Abendessen'){
      const src=permOf(w,meal)[di]; const b=baseRow(w,src,meal);
      row[4]=b[4]; row[6]= di===3?1:2; row[7]=src!==di;
      row[5]= di===3 ? 'Nur 1 Portion kochen (Freitagmittag entfällt)' : (di===6 ? p[5] : 'Doppelte Menge kochen, 2. Portion morgen 14 Uhr');
    } else if(meal==='Mittagessen' && di>=1 && /aufwärmen/.test(p[5]||'')){
      const b=baseRow(w,permOf(w,'Abendessen')[di-1],'Abendessen'); if(b) row[4]=b[4]; row[6]=2;
    } else if(meal!=='Mittagessen' && SWAP_MEALS.includes(meal)){
      const src=permOf(w,meal)[di]; const b=baseRow(w,src,meal); row[4]=b[4]; row[5]= src===di ? p[5] : stripDay(b[5]); row[7]=src!==di;
    } else if(meal==='Mittagessen' && di===0){
      // Monday lunch = Sunday dinner of the week before (week 1: the start dish, unless week 4's Sunday was swapped)
      const pw= w===1?4:w-1; const sw=permOf(pw,'Abendessen')[6];
      if(w>1 || sw!==6){ const b=baseRow(pw,sw,'Abendessen'); if(b){ row[4]=b[4]; row[7]= sw!==6; } }
      row[6]=2;
    } else if(meal==='Mittagessen'){ row[6]=(D.dishes[p[4]]&&D.dishes[p[4]].por)||1; }
    out.push(row);
  });
  EP=out; D.plan=out;
}
function g2(g){ return g>=10?Math.round(g):Math.round(g*10)/10; }
function computeNeeds(){
  const AB=['Mo','Di','Mi','Do','Fr','Sa','So'], ORDER=['So davor'].concat(AB);
  const need={1:{},2:{},3:{},4:{}}; const win={1:{},2:{},3:{},4:{}}; const seg={1:{},2:{},3:{},4:{}};
  EP.forEach(m=>{
    const meal=m[2], hint=m[5]||''; if(meal==='Mittagessen' && /aufwärmen/.test(hint)) return;
    const d=D.dishes[m[4]]; if(!d) return; const di=DAYS.indexOf(m[1]);
    let lab;
    if(/Start-Gericht/.test(hint)) lab='So davor';
    else if(['Frühstück','Frühsnack','Abendsnack'].includes(meal) && (d.va||0)>0) lab= di===0?'So davor':AB[di-1];
    else lab=AB[di];
    let por= meal==='Abendessen' ? m[6] : (/Start-Gericht/.test(hint) ? (d.por||1) : 1);
    { const dt=rowDate(m); if(rowSkipped(m,dt)) return; if(meal==='Abendessen') por=effPor(m,dt); }
    // Sunday trip covers everything up to Tuesday's 14:00 meal: So davor, Monday, and Tuesday's morning meals
    const inWin = lab==='So davor' || lab==='Mo' || (lab==='Di' && di===1 && (meal==='Frühstück'||meal==='Frühsnack'));
    // time the ingredients are needed (hours from Monday 0:00): A = until Tue 14:00, B = until Thu 17:00, C = rest of the week
    const HR={'Frühstück':8,'Frühsnack':11,'Mittagessen':14,'Abendessen':17,'Abendsnack':21};
    let t; if(/Start-Gericht/.test(hint)) t=-7; else if(['Frühstück','Frühsnack','Abendsnack'].includes(meal) && (d.va||0)>0) t=(di-1)*24+20; else t=di*24+(HR[meal]||12);
    const sg= t<38?'A':(t<89?'B':'C');
    d.ing.forEach(([n,g])=>{ const x=need[m[0]][n]=need[m[0]][n]||{}; x[lab]=(x[lab]||0)+g*por; if(inWin) win[m[0]][n]=(win[m[0]][n]||0)+g*por;
      const sx=seg[m[0]][n]=seg[m[0]][n]||{A:0,B:0,C:0}; sx[sg]+=g*por; });
  });
  D.win={}; for(let w=1;w<=4;w++){ D.win[w]={}; Object.keys(win[w]).forEach(n=>D.win[w][n]=g2(win[w][n])); }
  D.seg=seg;
  const r=g=> g>=10?Math.round(g):Math.round(g*10)/10;
  D.need={};
  for(let w=1;w<=4;w++){
    D.need[w]={}; const items=[];
    Object.keys(need[w]).forEach(n=>{
      const x=need[w][n]; D.need[w][n]=ORDER.filter(l=>x[l]).map(l=>[l,r(x[l])]);
      const tot=Object.values(x).reduce((a,b)=>a+b,0); if(tot<=0) return;
      const nu=D.nut[n]; items.push([nu?nu[0]:'Sonstiges', n, r(tot), (nu&&nu[1])?(Math.ceil(tot/nu[1]-1e-9)+' '+nu[2]):'']);
    });
    D.shop[w].items=items;
  }
}
/* ---------- automatic arrangement for the Sunday shop ---------- */
function effId(w,di,meal){ const r=EP.find(p=>p[0]===w&&p[1]===DAYS[di]&&p[2]===meal); return r?r[4]:null; }
function badIngs(id){ const sun=sundayStore(); const d=D.dishes[id]; if(!d) return []; return d.ing.map(([n])=>n).filter(n=>!(stockHas(n)&&S.stock[n]>0) && (S.assign[n]||'')!==sun); }
function sundayBadSet(w){
  // ingredients first needed on "So davor" or "Mo" that are not assigned to the Sunday store
  const sun=sundayStore(); const set=new Set();
  Object.entries((D.win&&D.win[w])||{}).forEach(([n,g])=>{ if(g>0 && !(stockHas(n)&&S.stock[n]+0.5>=g) && (S.assign[n]||'')!==sun) set.add(n); });
  return set;
}
function trySwap(w,meal,a,b){ const p=permOf(w,meal).slice(); [p[a],p[b]]=[p[b],p[a]]; S.mealSwap=S.mealSwap||{}; S.mealSwap[w]=S.mealSwap[w]||{}; if(p.every((v,i)=>v===i)) delete S.mealSwap[w][meal]; else S.mealSwap[w][meal]=p; recomputeAll(); }
function autoArrange(w){
  const before=sundayBadSet(w).size; let swaps=0;
  // greedy improvement: try every allowed swap that touches Monday (or the Tuesday prep slot), keep it if the Sunday list gets better
  for(let round=0; round<3; round++){
    let improved=false;
    for(const meal of ['Abendessen','Frühstück','Frühsnack','Abendsnack']){
      for(const slot of [0,1]){
        if(slot===1 && !['Frühstück','Frühsnack'].includes(meal)) continue;   // Tuesday breakfast/snack is prepped on Monday evening
        const group=swapGroup(meal,slot); if(group.length<2) continue;
        let best=sundayBadSet(w).size, bestO=null;
        for(const o of group){ if(o===slot || (slot===1&&o===0)) continue;
          trySwap(w,meal,slot,o); const sc=sundayBadSet(w).size; trySwap(w,meal,slot,o);
          if(sc<best){ best=sc; bestO=o; } }
        if(bestO!==null){ trySwap(w,meal,slot,bestO); swaps++; improved=true; }
      }
    }
    if(!improved) break;
  }
  return {before, after:sundayBadSet(w).size, swaps};
}

function recomputeAll(){ buildEP(); computeNeeds(); if(typeof rebuildOCC==='function') rebuildOCC(); }

function storeSummary(id){
  const d=D.dishes[id]; const cnt={};
  d.ing.forEach(([n])=>{ const st=S.assign[n]||'ohne Laden'; cnt[st]=(cnt[st]||0)+1; });
  const sun=sundayStore();
  return Object.entries(cnt).sort((a,b)=>(b[0]===sun)-(a[0]===sun)||b[1]-a[1]).map(([s,c])=>`<span class="dchip${s===sun?'':s==='ohne Laden'?' none':' other'}">${esc(s)} ${c}</span>`).join('');
}
function sundayStore(){ return S.sundayStore || (S.stores.includes('Markttreff')?'Markttreff':(S.stores[0]||'')); }

function openSwap(w,di,meal){
  const group=swapGroup(meal,di).filter(o=>o!==di);
  const cur=EP.find(p=>p[0]===w&&p[1]===DAYS[di]&&p[2]===meal); const cd=D.dishes[cur[4]];
  let h=sheetHead(`${meal} · Woche ${w} · ${DAYS[di]}`, 'Gericht tauschen');
  h+=`<div class="panel" style="margin-top:8px"><div class="eyebrow">Jetzt</div><b>${esc(cd.n)}</b><div class="muted num" style="font-size:.88rem">${fmt(cd.kcal)} kcal · ${fmt(cd.p)} g Protein</div><div class="days" style="margin-top:6px">${storeSummary(cur[4])}</div></div>
    <p class="muted" style="margin:10px 0 6px">Tausche mit einem anderen Tag dieser Woche. ${meal==='Abendessen'?'Die 2. Portion für das Mittagessen am nächsten Tag tauscht automatisch mit, beim Sonntag ist das der Montag der nächsten Woche.':meal==='Abendsnack'?'':'Unter der Woche wird nur mit anderen Werktagen getauscht, damit es morgens schnell bleibt.'} Die Zahlen zeigen, wie viele Zutaten welchem Laden zugeordnet sind.</p><div class="stack">`;
  group.forEach(o=>{
    const row=EP.find(p=>p[0]===w&&p[1]===DAYS[o]&&p[2]===meal); const d=D.dishes[row[4]];
    const note=[]; if(meal==='Abendessen'&&(o===3||di===3)) note.push(o===3?'Do: wird nur 1 Portion gekocht':'kommt auf Do: nur 1 Portion');
    h+=`<button class="day dayfit pick" data-swapto="${o}"><div style="min-width:0"><div class="d">${DAYS[o]}</div><b>${esc(d.n)}</b><div class="muted num" style="font-size:.85rem">${fmt(d.kcal)} kcal · ${fmt(d.p)} g Protein${row[5]&&meal!=='Abendessen'?' · '+esc(row[5]):''}${note.length?' · '+esc(note.join(', ')):''}</div><div class="days" style="margin-top:6px">${storeSummary(row[4])}</div></div></button>`;
  });
  h+='</div>';
  if(S.mealSwap&&S.mealSwap[w]&&S.mealSwap[w][meal]) h+=`<div class="row" style="margin-top:12px"><button class="btn ghost" id="swapReset">${esc(meal)} in Woche ${w} zurücksetzen</button></div>`;
  sheetOpen(h);
  const inner=$('#sheetInner');
  inner.querySelectorAll('[data-swapto]').forEach(b=>b.onclick=()=>{
    const o=+b.dataset.swapto; const p=permOf(w,meal).slice(); [p[di],p[o]]=[p[o],p[di]];
    S.mealSwap=S.mealSwap||{}; S.mealSwap[w]=S.mealSwap[w]||{};
    if(p.every((v,i)=>v===i)) delete S.mealSwap[w][meal]; else S.mealSwap[w][meal]=p;
    recomputeAll(); persist(); closeSheet(); keepScroll(render);
  });
  const rs=inner.querySelector('#swapReset'); if(rs) rs.onclick=()=>{ delete S.mealSwap[w][meal]; recomputeAll(); persist(); closeSheet(); keepScroll(render); };
}


/* ---------- views ---------- */
let autoMsg='';

function viewHeute(){
  const today=new Date(); today.setHours(0,0,0,0);
  if(!offsetInit){ offsetInit=true; const p0=cyclePos(today); if(p0.before) offset=-p0.diff; }
  const date=addDays(today,offset); const pos=cyclePos(date);
  const dayName=DAYS[pos.dow];
  const label=date.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
  setHeader(offset===0?'Heute':(offset===1?'Morgen':(offset===-1?'Gestern':label.split(',')[0])), `Woche ${pos.week} · ${dayName}`);
  let h=`<div class="daybar"><button class="iconbtn" id="prev" aria-label="Vorheriger Tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="title"><div class="muted">${esc(label)}</div><div class="eyebrow">${esc(THEMES[pos.week])}</div></div>

function viewWoche(){
  const pos=cyclePos(new Date()); if(!planWeek) planWeek=pos.before?1:pos.week;
  setHeader('4-Wochen-Plan', `Woche ${planWeek}`);
  let h=modeSeg()+weekSeg(planWeek,'pw')+`<div class="theme">${esc(THEMES[planWeek])}</div><div class="stack">`;
  DAYS.forEach((dn,i)=>{
    const wdate=addDays(cycleBase(planWeek),(planWeek-1)*7+i); const ms=mealsFor(planWeek,dn); const t=dayTotals(ms,wdate);
    const isToday=!pos.before && pos.week===planWeek && pos.dow===i;
    h+=`<details class="day"${isToday?' open':''}><summary><span class="d">${dn}${isToday?' <span class="chip a">heute</span>':''}</span><span class="muted num">${fmt(t.kcal)} kcal · ${fmt(t.p)} g P</span></summary><div class="items">`+
      ms.map(m=>{const d=D.dishes[m[4]]; const sk=rowSkipped(m,wdate); const por=(m[2]==='Abendessen'||m[2]==='Mittagessen')?(effPor(m,wdate)||rowPor(m)):1; const sw=canSwap(m[2],i)&&!sk; return `<div class="wrow${sk?' skipped':''}"><button class="wmeal" data-dish="${esc(m[4])}" data-por="${por}"><span class="t">${esc(m[3])}</span><span class="n"><span class="kind eyebrow">${esc(m[2])}${m[7]?' <span class="swaptag">getauscht</span>':''}</span><br><b>${esc(d.n)}</b>${m[5]?`<br><span class="muted" style="font-size:.85rem">${esc(m[5])}</span>`:''}</span><span class="k">${fmt(d.kcal)} kcal<br>${fmt(d.p)} g P</span></button>${sw?`<button class="swapbtn" data-swap="${planWeek}|${i}|${esc(m[2])}" aria-label="${esc(m[2])} am ${dn} tauschen">⇄</button>`:'<span class="swapbtn off" title="fest"></span>'}${sk==='dinner'?'<span class="swapbtn off"></span>':`<button class="swapbtn skipbtn" data-wskip="${iso(wdate)}|${esc(m[2])}" aria-pressed="${!!sk}" aria-label="${esc(m[2])} am ${dn} ${sk?'wieder essen':'diese Woche auslassen'}">${sk?'↺':'⊘'}</button>`}</div>`;}).join('')+`</div></details>`;
  });
  h+='</div>';
  h+=`<p class="muted" style="font-size:.85rem;margin-top:12px">Mit ⊘ lässt du ein Gericht nur in dieser Woche aus, seine Zutaten verschwinden dann aus der Einkaufsliste. Mit ⇄ tauschst du ein Gericht mit einem anderen Tag derselben Woche: Frühstück gegen Frühstück, Snack gegen Snack. Ein Abendessen nimmt sein Mittagessen am nächsten Tag mit, beim Sonntag das Montags-Mittagessen der nächsten Woche.</p>`;
  if(S.mealSwap&&S.mealSwap[planWeek]&&Object.keys(S.mealSwap[planWeek]).length) h+=`<div class="row"><button class="btn ghost" id="swapWeekReset">Alle Tausche in Woche ${planWeek} zurücksetzen</button></div>`;
  $('#view').innerHTML=h;

  document.querySelectorAll('[data-wskip]').forEach(bt=>bt.onclick=()=>{ const [ds,meal]=bt.dataset.wskip.split('|'); toggleSkip(parseISO(ds),meal); keepScroll(render); });
  const swr=$('#swapWeekReset'); if(swr) swr.onclick=()=>{ delete S.mealSwap[planWeek]; recomputeAll(); persist(); render(); };
  bindModeSeg();
}

const SPICE_CAT='Gewürze & Basics';
function spicesFor(w){ return []; } // spices are now regular ingredients with amounts
function fmtG(g){ return g<10 ? (Math.round(g*10)/10).toLocaleString('de-DE') : fmt(g); }
function spoon(n,g){
  const tl=D.tlg&&D.tlg[n]; if(!tl) return '';
  if(g<0.45) return 'Prise';
  const t=g/tl; const half=v=>{ const r=Math.round(v*4)/4; return r.toLocaleString('de-DE').replace('0,25','¼').replace('0,5','½').replace('0,75','¾').replace(',25',' ¼').replace(',5',' ½').replace(',75',' ¾'); };
  return t>=3 ? 'ca. '+half(t/3)+' EL' : 'ca. '+half(t)+' TL';
}
/* migrate store/home marks of the old spice list (keys "g:Name") to the new ingredient names */
(function migrateSpices(){
  const MAP={'Salz':'Salz','Pfeffer':'Pfeffer (gemahlen)','Oregano':'Oregano (getrocknet)','Paprikapulver':'Paprikapulver (edelsüß)','Kreuzkümmel':'Kreuzkümmel (gemahlen)','Zimt':'Zimt','Kurkuma':'Kurkuma (gemahlen)','Rosmarin':'Rosmarin (getrocknet)','Thymian':'Thymian (getrocknet)','Basilikum':'Basilikum (frisch)','Dill':'Dill (frisch)','Petersilie':'Petersilie (frisch)','Schnittlauch':'Schnittlauch (frisch)','Backpulver':'Backpulver','Essig':'Essig','Senf':'Senf (mittelscharf)','Meerrettich':'Meerrettich (Glas)','Gemüsebrühe':'Gemüsebrühe (Pulver)','Chili':'Chiliflocken'};
  let ch=false;
  Object.keys(S.assign||{}).forEach(k=>{ if(k.startsWith('g:')){ const n=MAP[k.slice(2)]; if(n && !S.assign[n]) S.assign[n]=S.assign[k]; delete S.assign[k]; ch=true; } });
  ['home','checks'].forEach(f=>Object.values(S[f]||{}).forEach(o=>Object.keys(o).forEach(k=>{ if(k.startsWith('g:')){ const n=MAP[k.slice(2)]; if(n) o[n]=o[k]; delete o[k]; ch=true; } })));
  if(ch) saveLocal();
})();
function amtStr(name,g){ const nu=D.nut[name]; const unit=(nu&&nu[1])?(Math.ceil(g/nu[1]-1e-9)+' '+nu[2]):''; return `${fmtG(g)}\u00a0g`+(D.tlg&&D.tlg[name]?` (${spoon(name,g)})`:'')+(unit?` · ca.\u00a0${unit}`:''); }
function sundayCard(w, winItems){
  const sun=sundayStore(); const sunItems=winItems.filter(it=>!isClosed(w,it) && !((S.checks[w]||{})['so:'+it.name]));
  const other=sunItems.filter(it=>storeOf(it)!==sun);

    h+=`<div class="panel prep stack" style="margin-top:12px"><div class="row" style="justify-content:space-between"><b>Sonntagseinkauf · alles bis Dienstag 14 Uhr</b><select id="sunStore" class="store" aria-label="Laden für den Sonntagseinkauf">${S.stores.map(s=>`<option${s===sun?' selected':''}>${esc(s)}</option>`).join('')}</select></div>

      <div class="num">${sunItems.length} Artikel offen · ${sunItems.length-other.length} bei ${esc(sun)}${other.length?` · <b style="color:var(--tomato)">${other.length} woanders oder ohne Laden</b>`:''}</div>
      ${other.length?`<div class="muted" style="font-size:.88rem">${other.map(it=>esc(it.name)+(storeOf(it)?' ('+esc(storeOf(it))+')':'')).join(', ')}</div><div class="row"><button class="btn" id="autoArr">Montag automatisch nach ${esc(sun)} anordnen</button><button class="btn ghost" id="autoArrAll">Alle 4 Wochen</button></div><div class="muted" style="font-size:.85rem">Die App tauscht Gerichte so, dass für Sonntag und Montag möglichst viel bei ${esc(sun)} zu bekommen ist. Vorher solltest du den Zutaten in der Liste ihre Läden zuordnen.</div>`:`<div class="muted" style="font-size:.88rem">Alles für Sonntag und Montag bekommst du bei ${esc(sun)}.</div>`}</div>`;
  return h;
}
function tripParts(w,name){
  // split one week's need of an ingredient into the three shopping rounds
  const fr=sundayStore(); const sx=(D.seg&&D.seg[w]&&D.seg[w][name])||{A:0,B:0,C:0};
  const st=S.assign[name]||''; const other= !!st && st!==fr;
  const r= g=>g2(g);
  if(other) return [{trip:'r1',key:'so:'+name,g:r(sx.A),warn:true},{trip:'r2',key:'r2:'+name,g:r(sx.B+sx.C)}].filter(p=>p.g>0.05);
  return [{trip:'r1',key:'so:'+name,g:r(sx.A+sx.B)},{trip:'r3',key:'r3:'+name,g:r(sx.C)}].filter(p=>p.g>0.05);
}
const TRIPLBL={r1:'Sa/So',r2:'Di',r3:'Do'};
function tripItems(w){
  const out=[];
  D.shop[w].items.forEach(([cat,name,g])=>{
    const parts=tripParts(w,name);
    parts.forEach(p=>{ const others=parts.filter(q=>q!==p).map(q=>`${TRIPLBL[q.trip]}: ${fmtG(q.g)} g`).join(' · ');
      out.push({key:p.key,name,cat,g:p.g,trip:p.trip,warn:p.warn,extra:false,amt:amtStr(name,p.g)+(others?` · ${others}`:'')}); });
  });
  (S.extra[w]||[]).forEach(e=>out.push({key:'x:'+e.id,name:e.name,cat:'Eigene Artikel',amt:e.amt||'',extra:true,id:e.id,trip:(S.assign['x:'+e.id]&&S.assign['x:'+e.id]!==sundayStore())?'r2':'r3'}));
  return out;
}
function shopItems(w){
  if(shopSort==='trip') return tripItems(w);
  const base=D.shop[w].items.map(([cat,name,g,unit])=>({key:name,name,cat,g,win:(D.win[w]&&D.win[w][name])||0,amt:`${fmtG(g)}\u00a0g`+(D.tlg&&D.tlg[name]?` (${spoon(name,g)})`:'')+(unit?` · ca.\u00a0${unit}`:''),extra:false}));
  const sp=spicesFor(w).map(n=>({key:'g:'+n,name:n,cat:SPICE_CAT,amt:'nach Bedarf',extra:false,spice:true}));
  const ex=(S.extra[w]||[]).map(e=>({key:'x:'+e.id,name:e.name,cat:'Eigene Artikel',amt:e.amt||'',extra:true,id:e.id}));
  return base.concat(sp,ex);
}
function storeKey(it){ return it.extra||it.spice?it.key:it.name; }
function storeOf(it){ return S.assign[storeKey(it)]||''; }
function isDone(w,it){ const c=S.checks[w]||{}; if(c[it.key]) return true; if(!it.trip && !it.extra){ const ps=tripParts(w,it.name); if(ps.length && ps.every(p=>c[p.key])) return true; } return false; }
function isHomeManual(w,it){
  const v=S.home&&S.home[w]&&S.home[w][it.key]; if(!v) return false;
  if(it.spice||it.extra||!stockHas(it.name)) return true;
  const now=S.stock[it.name]; const at=(typeof v==='object'&&v.s!=null)?v.s:now;
  // manual mark ends once the stock went down after marking and no longer covers what is still needed
  return !(now < at-0.5 && now+0.5 < remainingNeed(w,it.name));
}
function isHomeAuto(w,it){ if(it.extra||it.spice) return false; if(S.homeOff&&S.homeOff[w]&&S.homeOff[w][it.key]) return false;
  if(it.trip==='r1') return stockHas(it.name) && S.stock[it.name]+0.5>=it.g;
  if(it.trip) return stockHas(it.name) && S.stock[it.name]+0.5>=remainingNeed(w,it.name);
  return stockCovers(w,it.name); }
function isHome(w,it){ return !isDone(w,it) && (isHomeManual(w,it)||isHomeAuto(w,it)); }
function isClosed(w,it){ return isDone(w,it)||isHome(w,it); }
function catRank(c){ const i=CAT_ORDER.indexOf(c); return i<0?99:i; }

    ${it.extra?`<button class="del" data-del="${esc(it.id)}" aria-label="${esc(it.name)} löschen">✕</button>`:''}</div></div>`;

    h+=sundayCard(w, items.filter(it=>!it.extra && ((D.win[w]&&D.win[w][it.name])||0)>0));
  } else {
    const cats=[...new Set(items.map(i=>i.cat))].sort((a,b)=>catRank(a)-catRank(b));
    groups=cats.map(c=>({title:c, items:items.filter(it=>it.cat===c)}));
  }
  groups.forEach(g=>{
    if(!g.items.length) return;
    const open=g.items.filter(it=>!isClosed(w,it)).length;
    let list=g.items.slice().sort((a,b)=>(catRank(a.cat)-catRank(b.cat))||a.name.localeCompare(b.name,'de'));
    if(hideDone) list=list.filter(it=>!isClosed(w,it));

    if(g.byStore){
      const sts=[...new Set(list.map(i=>storeOf(i)||'Noch kein Laden'))].sort((a,b)=>(S.stores.indexOf(a)+99*(a==='Noch kein Laden'))-(S.stores.indexOf(b)+99*(b==='Noch kein Laden')));
      h+=sts.map(st=>`<div class="subhead">${esc(st)}</div><div class="list">${list.filter(i=>(storeOf(i)||'Noch kein Laden')===st).map(it=>itemRow(w,it)).join('')}</div>`).join('');
    } else if(shopSort==='laden'||shopSort==='tag'||shopSort==='trip'){
      const cats=[...new Set(list.map(i=>i.cat))];
      h+=cats.map(c=>`<div class="subhead">${esc(c)}</div><div class="list">${list.filter(i=>i.cat===c).map(it=>itemRow(w,it)).join('')}</div>`).join('');
    } else {

    }
    h+='</section>';
  });
  h+=`<section class="group"><h3>Eigenen Artikel hinzufügen</h3>
    <form class="addform" id="addForm"><input id="addName" placeholder="z. B. Kaffee" aria-label="Artikel" required><input id="addAmt" placeholder="Menge" aria-label="Menge" style="width:90px"><button class="btn" type="submit">Dazu</button></form></section>
    <div class="row" style="margin-top:16px">${confirmReset?`<span>Alle Haken in Woche ${w} entfernen (gekauft und zu Hause)?</span><button class="btn warn" id="resetYes">Ja, zurücksetzen</button><button class="btn ghost" id="resetNo">Abbrechen</button>`:`<button class="btn ghost" id="reset">Haken dieser Woche zurücksetzen</button>`}</div>
    <div class="notes">${D.shop[w].notes.filter(n=>!/^Zusätzlich nach Bedarf:/.test(n)).map(n=>`<div>${esc(n)}</div>`).join('')}<div>Die kleinen Tags zeigen, an welchem Tag du eine Zutat zum Kochen oder Vorbereiten brauchst, bei mehreren Tagen mit der Menge pro Tag. „So davor“ ist der Sonntag vor der Woche. So kannst du den Einkauf auf mehrere Tage aufteilen.</div><div>Gewürze und Basics stehen ohne Menge in der Liste. Was du im Schrank hast, markierst du mit dem Haus-Symbol.</div><div>Der gewählte Laden gilt für jede Zutat in allen vier Wochen.</div></div>`;
  $('#view').innerHTML=h;
  document.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{shopWeek=+b.dataset.sw;confirmReset=false;autoMsg='';render();});
  document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{shopSort=b.dataset.sort;try{localStorage.setItem(LS+'-sort',shopSort)}catch(e){};render();});
  $('#hideDone').onclick=()=>{hideDone=!hideDone;render();};
  const ss=$('#sunStore'); if(ss) ss.onchange=()=>{ S.sundayStore=ss.value; persist(); keepScroll(render); };
  const aa=$('#autoArr'); if(aa) aa.onclick=()=>{ const r=autoArrange(w); persist(); autoMsg=r.swaps?`${r.swaps} Tausch${r.swaps>1?'e':''} in Woche ${w}: vorher ${r.before}, jetzt ${r.after} Artikel woanders.`:`Keine bessere Anordnung gefunden (${r.after} Artikel woanders). Ordne diese Zutaten ggf. ${sundayStore()} zu.`; keepScroll(render); };
  const aal=$('#autoArrAll'); if(aal) aal.onclick=()=>{ const parts=[1,2,3,4].map(x=>{ const r=autoArrange(x); return `W${x}: ${r.before}→${r.after}`; }); persist(); autoMsg='Artikel woanders vorher→nachher: '+parts.join(' · '); keepScroll(render); };
  const sb=$('#shopBk'); if(sb) sb.onchange=e=>importFromInput(e.target,'shopBkMsg');
  document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{ const k=b.dataset.check; const it=items.find(x=>x.key===k); S.checks[w]=S.checks[w]||{}; if(S.checks[w][k]){ delete S.checks[w][k]; if(it) removePurchase(w,it); } else { S.checks[w][k]=true; if(S.home&&S.home[w]) delete S.home[w][k]; if(it) addPurchase(w,it); } persist(); keepScroll(render); });

    if(it && isHome(w,it)){ delete S.home[w][k]; if(isHomeAuto(w,it)) S.homeOff[w][k]=true; }
    else { S.home[w][k]= (it&&stockHas(it.name))?{s:S.stock[it.name]}:true; delete S.homeOff[w][k]; if(S.checks[w]&&S.checks[w][k]){ delete S.checks[w][k]; if(it) removePurchase(w,it); } }

}

/* ---------- recipe sheet ---------- */
function stepsHtml(z){
  if(!z) return '';
  // split into phases (Am Vorabend / Morgens / Vor Ort) and numbered steps
  const parts=z.split(/(?=(?:Am Vorabend[^:]*:|Morgens \([^)]*\):|Vor Ort:))/);
  return parts.map(p=>{
    const m=p.match(/^(Am Vorabend[^:]*:|Morgens \([^)]*\):|Vor Ort:)\s*/);
    const head=m?m[1].replace(/:$/,''):''; let body=m?p.slice(m[0].length):p;
    const steps=body.split(/\s*(?=\b\d\)\s)/).map(s=>s.trim()).filter(Boolean);
    const pre=steps.length && !/^\d\)/.test(steps[0]) ? steps.shift() : '';
    return (head?`<div class="phase">${esc(head)}</div>`:'')+(pre?`<p style="margin:6px 0">${esc(pre)}</p>`:'')+
      (steps.length?`<ol class="steps">${steps.map(s=>`<li>${esc(s.replace(/^\d\)\s*/,''))}</li>`).join('')}</ol>`:'');
  }).join('');
}
function openDish(id, porArg){
  const d=D.dishes[id]; if(!d) return;
